<script type="text/html" data-help-name="ui-speed-dial">
    <p>A floating action button for the dashboard. A click opens a small menu; every action sends a message into the flow.</p>
    <p><b>Also controllable by message:</b> replace actions, change or remove single ones, change appearance and behavior, reset to the editor settings – for everybody or for one browser only. Examples and all fields under <i>Input</i>.</p>

    <h3>Basics</h3>
    <dl class="message-properties">
        <dt>Show</dt>
        <dd>
            <ul>
                <li><i>In a group's layout</i>: the button gets a fixed place in a group; pick its <b>size</b> on the grid, like other widgets.</li>
                <li><i>Floating over the page</i>: the button lies above the content, at the position from the <i>Appearance</i> tab.</li>
                <li><i>In the header</i>: the button sits on the right of the Dashboard header, next to its other content; the menu opens downwards. Position and edge distance do not apply. Small and transparent fits best (the editor offers this with one click). If the header is hidden in the Dashboard settings, the button floats at the top right.</li>
            </ul>
        </dd>
        <dt>On</dt>
        <dd>Only for <i>floating</i> and <i>header</i>: <i>One page</i>, <i>Selected pages</i> (choose the dashboard and tick the pages) or <i>All pages</i> of a dashboard.</dd>
    </dl>

    <h3>Actions tab</h3>
    <p>The entries of the menu (up to 100). <b>Add action</b> creates one, drag to reorder, the copy button duplicates an entry.</p>
    <ul>
        <li><b>Icon</b>: pick one from PrimeIcons or Material Design Icons, or use your own image (see <i>Icons</i>).</li>
        <li><b>Label</b>: text of the action. Styles without text show it as a tooltip.</li>
        <li><b>Payload</b>: value of <code>msg.payload</code> on click – text, number, true/false or JSON (including <code>null</code>).</li>
        <li><b>More options</b>:
            <ul>
                <li><b>ID</b>: unique name of the action, sent as <code>msg.action</code>. New actions derive it from the label automatically (and the payload too, as long as it was not changed). Letters, digits and <code>_ . : -</code>, at most 64 characters. If you change an ID later, update messages that use <code>patch</code>/<code>remove</code>.</li>
                <li><b>Topic</b>: optional <code>msg.topic</code>.</li>
                <li><b>Tooltip</b>: hover text.</li>
                <li><b>Color / Icon color</b>: custom colors for this action. <i>Default</i> or <i>Automatic</i> = Dashboard theme colors; the icon color adapts to a chosen color automatically.</li>
                <li><b>Visible / Enabled</b>: hidden or disabled actions send nothing.</li>
            </ul>
        </li>
    </ul>

    <h3>Appearance tab</h3>
    <p>At the top you can expand a <b>preview</b>. It shows a dashboard page in the colors of the selected theme. Clicking the button opens the menu with all current settings and the configured actions – settings from <i>Advanced</i> apply immediately, too. While there are no actions yet, five example actions are shown. Clicking an action tells you what it would send; the preview itself sends nothing.</p>
    <ul>
        <li><b>Position</b>: click a cell of the 3×3 grid. For <i>In a group's layout</i> it is relative to the widget's area, otherwise to the browser window.</li>
        <li><b>Style</b>: how the actions open – row (round icon buttons), row with text (separate buttons with labels), menu list (one panel with labelled rows in reading order), half, quarter or full circle. Circles need room: a quarter circle fits a corner, a full circle needs space all around (the <i>center</i> position works well).</li>
        <li><b>Opening direction</b>: click an arrow (not for the full circle). <i>Automatic</i> opens away from the nearest screen edge; only directions that fit the style and position are offered. Without enough room, a row moves to the side with the most space.</li>
        <li><b>Icon</b>: icon of the main button (see <i>Icons</i>).</li>
        <li><b>Icon when open</b>: replaces the icon while the menu is open. The default is an X. <i>Keep icon</i> leaves the normal icon in place.</li>
        <li><b>Color</b>: click a swatch. <i>Dashboard</i> = primary color of the Dashboard theme (the theme of the page). The icon color is chosen light or dark automatically.</li>
        <li><b>Size</b>: small, medium or large. Custom values under <i>Advanced</i>.</li>
    </ul>

    <h3>Advanced tab</h3>
    <ul>
        <li><b>Main button</b>: label next to the icon, tooltip, icon and text color, size in px (11–96), corner radius (0–48; 48 = round), edge distance (0–500 px, optionally separate for side and top/bottom), visible/enabled.</li>
        <li><b>Menu</b>: circle radius (0 = automatic), gap between actions (0–48 px), action size (44–80 px), animation duration (0–1000 ms), close after selection, dim the page.</li>
        <li><b>Display</b>: action corner radius (0–40 px), shadow, z-index (1–10000; increase it if other elements cover the button).</li>
    </ul>

    <h3>Icons</h3>
    <p>A click on the icon field opens the picker with three tabs:</p>
    <ul>
        <li><b>PrimeIcons</b>: 314 icons, included in the package (<code>pi-…</code>).</li>
        <li><b>Material Design</b>: more than 7,000 icons, the same as in the other Dashboard widgets (<code>mdi-…</code>). Search by name, e.g. <code>lightbulb</code>, <code>home</code>, <code>power</code>.</li>
        <li><b>Own image</b>: an SVG, PNG, WebP, GIF or JPG file
            <ul>
                <li><i>upload</i> it – the image is stored in the flow (at most 16 KB), or</li>
                <li>link it by <i>address</i>: <code>https://…</code> or a path like <code>/icons/lamp.svg</code>. Paths point to the folder set as <code>httpStatic</code> in Node-RED's <code>settings.js</code>.</li>
            </ul>
            Like the other icons, own images are tinted in the icon color. Single-color symbols with a transparent background work best, ideally as SVG. Photos or images without a transparent background show up as a plain colored area.</li>
    </ul>

    <h3>Choosing colors</h3>
    <p>Every color field shows a row of suggested colors. The first one (<i>Dashboard</i>, <i>Automatic</i> or <i>Default</i>) takes the color from the Dashboard theme. The checkered swatch means <i>transparent</i>. As a background only the icon remains – no fill, border or shadow (on the main button the icon uses the primary color). As icon and text color it makes icon and label invisible. The colorful swatch with the eyedropper on the right opens the browser's color dialog for any color. Next to it is the color as a hex value; you can also type a color there, with 8 digits even semi-transparent (e.g. <code>#2563eb80</code>).</p>

    <h3>Colors and the Dashboard theme</h3>
    <p>Without custom colors the speed dial follows the Dashboard theme: the main button uses the primary color, the actions use the surface and text color of the groups. Changing the theme therefore applies automatically. Custom colors override the theme only for that button or action.</p>

    <h3>Input: control the menu with messages</h3>
    <p>The actions and every setting of the <i>Appearance</i> and <i>Advanced</i> tabs can be changed at runtime with a message – for example from a function node. Only where it is shown, the group/page and the grid size are fixed. A message on the input produces <b>no</b> output.</p>

    <h4>The messages at a glance</h4>
    <dl class="message-properties">
        <dt>Replace all actions</dt>
        <dd><code>msg.payload = [ {…}, {…} ]</code></dd>
        <dt>Change appearance or behavior</dt>
        <dd><code>msg.payload = { button: {…}, menu: {…}, theme: {…} }</code></dd>
        <dt>Both in one message</dt>
        <dd><code>msg.payload = { actions: [ … ], button: {…} }</code></dd>
        <dt>Change single actions</dt>
        <dd><code>msg.command = "patch"</code>, <code>msg.payload = [ { id: "…", … } ]</code></dd>
        <dt>Remove actions</dt>
        <dd><code>msg.command = "remove"</code>, <code>msg.payload = [ "id", … ]</code></dd>
        <dt>Back to the editor settings</dt>
        <dd><code>msg.command = "reset"</code></dd>
        <dt>For one browser only</dt>
        <dd>add <code>msg._client</code> (see below)</dd>
    </dl>

    <h4>1. Replace all actions</h4>
    <p>An array in <code>msg.payload</code> replaces the whole list. Only <code>id</code> and <code>payload</code> are required, all other fields have defaults. An empty array removes all actions.</p>
<pre>msg.payload = [
    { id: "on",  label: "On",  icon: "mdi-lightbulb-on", payload: true },
    { id: "off", label: "Off", icon: "mdi-lightbulb-off", payload: false,
      topic: "light", background: "#dc2626" }
];
return msg;</pre>

    <h4>2. Change appearance or behavior</h4>
    <p>An object with <code>button</code>, <code>menu</code> and/or <code>theme</code>. <b>Only the given fields</b> change, everything else stays as it is.</p>
<pre>msg.payload = {
    button: { icon: "mdi-bell", background: "#16a34a", label: "Alarm" },
    menu:   { shape: "semi-circle", direction: "auto" }
};
return msg;</pre>
    <p>With <code>actions</code> in the same object the actions are replaced as well (as in 1.).</p>

    <h4>3. Change single actions – <code>patch</code></h4>
    <p>Each object names the <code>id</code> of an existing action and only the fields that should change. Several actions per message are possible.</p>
<pre>msg.command = "patch";
msg.payload = [
    { id: "off", enabled: false },
    { id: "on",  label: "Light is on", icon: "mdi-check" }
];
return msg;</pre>
    <p>Typical uses: hide an action (<code>visible: false</code>), disable it (<code>enabled: false</code>), change its label, icon, color or payload.</p>

    <h4>4. Remove actions – <code>remove</code></h4>
<pre>msg.command = "remove";
msg.payload = ["off"];
return msg;</pre>

    <h4>5. Reset – <code>reset</code></h4>
    <p>Restores the settings and actions from the editor and discards all changes made by messages. <code>msg.payload</code> is ignored.</p>
<pre>msg.command = "reset";
return msg;</pre>

    <h4>6. Change it for one browser only – <code>msg._client</code></h4>
    <p>Without <code>_client</code> every change applies to all browsers. With <code>msg._client</code> it applies to one browser or tab only – this works with all messages above, including <code>patch</code>, <code>remove</code> and <code>reset</code>.</p>
    <ul>
        <li><code>socketId</code>: exactly one browser tab.</li>
        <li><code>clientId</code>: all open tabs of that browser.</li>
    </ul>
    <p><b>Requirements</b> (both in the Dashboard settings, <i>Client Data</i> section):</p>
    <ul>
        <li><i>Accept Client Data</i>: enable <code>ui-speed-dial</code> – otherwise a message with <code>_client</code> is rejected.</li>
        <li><i>Include Client Data</i>: enable it so that a click delivers <code>msg._client</code> on the output. That way the flow knows which browser to answer.</li>
    </ul>
<pre>// Answer the browser that just clicked
// (msg comes straight from the speed dial output)
return {
    _client: msg._client,
    command: "patch",
    payload: [{ id: msg.action, enabled: false }]
};</pre>
    <p>The browser must be connected at that moment. A later message without <code>_client</code> discards all per-browser changes; when a browser leaves the page, its change is discarded.</p>

    <h4>All fields</h4>
    <p><b>Action</b> (in <code>payload</code>, <code>actions</code> or <code>patch</code>):</p>
    <dl class="message-properties">
        <dt>id <span class="property-type">string, required</span></dt>
        <dd>Unique, sent as <code>msg.action</code>. Letters, digits, <code>_ . : -</code>, at most 64 characters.</dd>
        <dt>payload <span class="property-type">any, required</span></dt>
        <dd>Sent as <code>msg.payload</code> on click: text, number, true/false, object, array or <code>null</code>.</dd>
        <dt class="optional">label <span class="property-type">string</span></dt>
        <dd>Label, default <code>"Action"</code>. Plain text, no HTML.</dd>
        <dt class="optional">icon <span class="property-type">string</span></dt>
        <dd>Default <code>"pi-circle"</code>. See <i>Values for colors and icons</i>.</dd>
        <dt class="optional">tooltip, topic <span class="property-type">string</span></dt>
        <dd>Hover text and <code>msg.topic</code> on click.</dd>
        <dt class="optional">background, color <span class="property-type">string</span></dt>
        <dd>Background and icon color, <code>""</code> = theme. See <i>Values for colors and icons</i>.</dd>
        <dt class="optional">visible, enabled <span class="property-type">boolean</span></dt>
        <dd>Default <code>true</code>. Hidden or disabled actions send nothing.</dd>
    </dl>
    <p><b>button</b> – the main button:</p>
    <dl class="message-properties">
        <dt class="optional">icon, closeIcon <span class="property-type">string</span></dt>
        <dd>Icon and icon while open. Default <code>"pi-plus"</code> / <code>"pi-times"</code>; <code>closeIcon: ""</code> keeps the normal icon.</dd>
        <dt class="optional">label, tooltip <span class="property-type">string</span></dt>
        <dd>Text next to the icon and hover text.</dd>
        <dt class="optional">background, color <span class="property-type">string</span></dt>
        <dd><code>""</code> = primary color of the theme and a matching icon color.</dd>
        <dt class="optional">size <span class="property-type">number</span></dt>
        <dd>11–96 px, default 56.</dd>
        <dt class="optional">radius <span class="property-type">number</span></dt>
        <dd>0–48 px, default 48 (round).</dd>
        <dt class="optional">position <span class="property-type">string</span></dt>
        <dd><code>top-left</code>, <code>top-center</code>, <code>top-right</code>, <code>center-left</code>, <code>center</code>, <code>center-right</code>, <code>bottom-left</code>, <code>bottom-center</code>, <code>bottom-right</code> (default).</dd>
        <dt class="optional">offsetX, offsetY <span class="property-type">number</span></dt>
        <dd>Distance to the edge, 0–500 px, default 24.</dd>
        <dt class="optional">visible, enabled <span class="property-type">boolean</span></dt>
        <dd>Show/hide or disable the button.</dd>
    </dl>
    <p><b>menu</b> – layout and behavior:</p>
    <dl class="message-properties">
        <dt class="optional">mode, shape, showLabels</dt>
        <dd>The <i>style</i> from the editor:
            row = <code>{ mode: "speed-dial", shape: "linear", showLabels: false }</code>,
            row with text = <code>showLabels: true</code> instead,
            menu list = <code>{ mode: "menu" }</code>,
            circles = <code>shape: "semi-circle"</code>, <code>"quarter-circle"</code> or <code>"circle"</code>.</dd>
        <dt class="optional">direction <span class="property-type">string</span></dt>
        <dd><code>auto</code> (default); rows and half circles <code>up</code>, <code>down</code>, <code>left</code>, <code>right</code>; quarter circles <code>up-left</code>, <code>up-right</code>, <code>down-left</code>, <code>down-right</code>. The full circle has no direction.</dd>
        <dt class="optional">gap, actionSize, radius <span class="property-type">number</span></dt>
        <dd>Gap between actions (0–48, default 8), action size (44–80, default 44), circle radius (0–500, 0 = automatic).</dd>
        <dt class="optional">duration <span class="property-type">number</span></dt>
        <dd>Animation duration 0–1000 ms, default 150.</dd>
        <dt class="optional">closeOnSelect, overlay <span class="property-type">boolean</span></dt>
        <dd>Close after a selection (default <code>true</code>), dim the page (default <code>false</code>).</dd>
    </dl>
    <p><b>theme</b> – display of all actions:</p>
    <dl class="message-properties">
        <dt class="optional">mode <span class="property-type">string</span></dt>
        <dd><code>auto</code> = Dashboard theme colors (default), <code>light</code> or <code>dark</code> = fixed light or dark colors. Messages only.</dd>
        <dt class="optional">background, color <span class="property-type">string</span></dt>
        <dd>Shared background and text color of all actions. Messages only; an action's own colors take precedence.</dd>
        <dt class="optional">radius <span class="property-type">number</span></dt>
        <dd>Action corner radius, 0–40 px, default 12.</dd>
        <dt class="optional">shadow <span class="property-type">boolean</span></dt>
        <dd>Shadow, default <code>true</code>.</dd>
        <dt class="optional">zIndex <span class="property-type">number</span></dt>
        <dd>1–10000, default 2000.</dd>
    </dl>

    <h4>Values for colors and icons</h4>
    <ul>
        <li><b>Colors</b>: hex values <code>#rgb</code>, <code>#rrggbb</code> or <code>#rrggbbaa</code> (with transparency), e.g. <code>"#2563eb"</code>. <code>""</code> = color from the theme, <code>"#00000000"</code> = transparent. Color names like <code>"red"</code> do not work.</li>
        <li><b>Icons</b>: <code>"pi-…"</code> (PrimeIcons), <code>"mdi-…"</code> (Material Design Icons), an image address (<code>"/icons/lamp.svg"</code>, <code>"https://…"</code>), an image as <code>"data:image/…;base64,…"</code> (at most 16 KB) or <code>""</code> for no icon.</li>
    </ul>

    <h4>When a message has no effect</h4>
    <p>A faulty message is discarded <b>completely</b> – nothing changes – and a warning with the reason appears in the debug sidebar. Common causes:</p>
    <ul>
        <li>A typo in a field name (e.g. <code>colour</code> instead of <code>color</code>) or a field that does not exist.</li>
        <li>Numbers as text (<code>"56"</code> instead of <code>56</code>) or outside the allowed range.</li>
        <li>Color names instead of hex values; icon names without <code>pi-</code>/<code>mdi-</code>.</li>
        <li><code>shape</code> changed while the previous <code>direction</code> does not fit the new shape – send both together or use <code>direction: "auto"</code>.</li>
        <li><code>patch</code>/<code>remove</code> with an ID that does not exist, or duplicate IDs.</li>
        <li>An action without <code>payload</code> (<code>null</code> is allowed, missing is not).</li>
        <li><code>_client</code> without enabling <i>Accept Client Data</i>, or for a browser that is not connected.</li>
    </ul>
    <p>Changes made by messages last until the next deploy or restart of Node-RED. Ready-made examples for every case: <b>Menu → Import → Examples → node-red-dashboard-2-ui-speed-dial → speed-dial-input-reference</b>.</p>

    <h3>Output</h3>
    <p>On a click on a visible, enabled action:</p>
    <dl class="message-properties">
        <dt>payload <span class="property-type">any</span></dt>
        <dd>The payload of the chosen action.</dd>
        <dt>action <span class="property-type">string</span></dt>
        <dd>The ID of the action – handy for a switch node.</dd>
        <dt class="optional">topic <span class="property-type">string</span></dt>
        <dd>The topic of the action, if set.</dd>
        <dt class="optional">_client <span class="property-type">object</span></dt>
        <dd>The browser that clicked – only if <i>Include Client Data</i> is enabled in the Dashboard. Use it to answer exactly that browser (see <i>Change it for one browser only</i>).</dd>
    </dl>

    <h3>Behavior</h3>
    <p>The menu closes on Escape and on a click outside. With the system setting “reduce motion” nothing is animated. The button works with the keyboard (arrow keys, Home/End, Enter).</p>
</script>
