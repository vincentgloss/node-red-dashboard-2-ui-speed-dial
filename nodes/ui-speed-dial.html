<script type="text/javascript">
/* global RED, $, document, window */
(function () {
    const fieldDefaults = {
        name: { value: '' },
        scope: { value: 'page' },
        group: { value: '', type: 'ui-group', validate: function (v) { return this.scope !== 'group' || !!v; } },
        page: { value: '', type: 'ui-page', validate: function (v) { return this.scope !== 'page' || !!v; } },
        ui: { value: '', type: 'ui-base', validate: function (v) { return this.scope !== 'all' || !!v; } },
        order: { value: 0 },
        width: { value: 3 },
        height: { value: 4 },
        actions: { value: [] },
        button: { value: {} },
        menu: { value: {} },
        theme: { value: {} }
    };
    // Same palette section as the Dashboard 2 widgets (localized by the dashboard itself).
    function dashboardCategory() {
        const label = RED._('@flowfuse/node-red-dashboard/ui-base:ui-base.label.category');
        return label && label.indexOf(':') === -1 ? label : 'Dashboard 2';
    }
    RED.nodes.registerType('ui-speed-dial', {
        category: dashboardCategory(), color: '#a6bbcf', defaults: fieldDefaults,
        inputs: 1, outputs: 1, icon: 'font-awesome/fa-plus', paletteLabel: 'speed dial',
        label: function () { return this.name || 'speed dial'; },
        oneditprepare: function () { prepareEditor(this); },
        oneditcancel: function () { cancelEditor(); },
        oneditsave: function () { saveEditor(this); }
    });

    const sections = ['button', 'menu', 'theme'];
    const types = ['str', 'num', 'bool', 'json'];
    let loadedSchema = null;
    let list = null;
    let nodeRef = null;
    let schemaError = null;
    let schemaRequest = null;

    function esc(value) { return $('<div>').text(String(value)).html(); }
    // Translations live in nodes/locales/<lang>/ui-speed-dial.json (namespace <package>/<node file>).
    const NS = 'node-red-dashboard-2-ui-speed-dial/ui-speed-dial:';
    function t(key, options) {
        const text = RED._(NS + key, options);
        return text === NS + key || text === key ? key : text;
    }
    function hasText(key) { return t(key) !== key; }
    function applyI18n() {
        $('#sd-editor [data-sd-i18n]').each(function () { $(this).html(t($(this).attr('data-sd-i18n'))); });
    }
    function makeId() {
        if (RED.util && typeof RED.util.generateId === 'function') return RED.util.generateId();
        return 'action-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
    }
    function defaultFor(field) { return Object.prototype.hasOwnProperty.call(field, 'default') ? field.default : ''; }
    function fieldTitle(key) {
        if (hasText('field.' + key)) return t('field.' + key);
        return key.replace(/([A-Z])/g, ' $1').replace(/^./, function (s) { return s.toUpperCase(); });
    }
    function updateReset($input) {
        const def = $input.attr('data-default');
        const $btn = $input.siblings('.sd-reset');
        if (def === undefined || !$btn.length) return;
        $btn.css('visibility', $input.val() !== '' && Number($input.val()) === Number(def) ? 'hidden' : 'visible');
    }
    function attachResets() {
        $('#sd-editor input[type=number][data-default]').each(function () {
            const $input = $(this);
            if (!$input.siblings('.sd-reset').length) {
                $('<button type="button" class="sd-reset">&#8634;</button>').attr('title', t('reset.title')).insertAfter($input);
            }
            $input.siblings('.sd-reset').attr('aria-label', t('reset.aria', { value: $input.attr('data-default') }));
            updateReset($input);
        });
    }
    function colorPicker() {
        return ' <input type="color" class="sd-color-picker" aria-label="' + esc(t('color.pick')) + '" value="#000000" tabindex="0"> <button type="button" class="sd-color-clear" aria-label="' + esc(t('color.clear')) + '" title="' + esc(t('color.clearTitle')) + '">&times;</button>';
    }
    function hexForPicker(text) {
        const m = /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/.exec(text || '');
        if (!m) return null;
        let h = m[1].toLowerCase();
        if (h.length === 3) h = h.replace(/./g, '$&$&');
        return '#' + h.slice(0, 6);
    }
    function syncPicker($text) {
        const hex = hexForPicker($text.val());
        $text.siblings('.sd-color-picker').val(hex || '#000000').toggleClass('sd-color-empty', !hex);
    }
    function controlFor(section, key, field) {
        const id = 'sd-' + section + '-' + key;
        const value = defaultFor(field);
        let input;
        if (field.type === 'enum') {
            input = '<select id="' + id + '" data-section="' + section + '" data-key="' + key + '">' + field.values.map(v => '<option value="' + esc(v) + '">' + esc(v) + '</option>').join('') + '</select>';
        } else if (field.type === 'boolean') {
            input = '<input id="' + id + '" type="checkbox" data-section="' + section + '" data-key="' + key + '">';
        } else {
            const numeric = field.type === 'number';
            input = '<input id="' + id + '" type="' + (numeric ? 'number' : 'text') + '" data-section="' + section + '" data-key="' + key + '"' +
                (numeric && field.min !== undefined ? ' min="' + field.min + '"' : '') +
                (numeric && field.max !== undefined ? ' max="' + field.max + '"' : '') +
                (numeric ? ' data-default="' + esc(value) + '"' : '') +
                (field.max !== undefined && field.type === 'string' ? ' maxlength="' + field.max + '"' : '') +
                ' value="' + esc(value) + '">';
        }
        if (field.type === 'color') input += colorPicker();
        return '<div class="form-row sd-schema-row" data-schema-section="' + section + '" data-schema-key="' + key + '"><label for="' + id + '">' + fieldTitle(key) + '</label><div class="sd-control">' + input + '</div></div>';
    }
    function prepareEditor(node) {
        if (schemaRequest && schemaRequest.readyState !== 4) schemaRequest.abort();
        nodeRef = node;
        loadedSchema = null;
        schemaError = null;
        const $ok = $('#node-dialog-ok');
        $ok.prop('disabled', true);
        applyI18n();
        $('#sd-schema-warning').hide().text(t('loading'));
        $('#sd-schema-warning').show();
        const request = $.getJSON('ui-speed-dial/schema');
        schemaRequest = request;
        request.done(function (schema) {
            if (schemaRequest !== request) return;
            try {
                if (!schema || !schema.button || !schema.menu || !schema.theme || !schema.action || !schema.limits) throw new Error(t('err.schemaIncomplete'));
                loadedSchema = schema;
                buildSchemaForms(schema, node);
                buildActionList(schema, node.actions || []);
                bindEditorEvents();
                $('#sd-schema-warning').hide().text('');
                validateEditor();
            } catch (error) { failSchema(error); }
        }).fail(function (xhr, status) {
            if (schemaRequest !== request || status === 'abort') return;
            const message = xhr && xhr.status ? t('err.http', { status: xhr.status }) : t('err.network');
            failSchema(new Error(t('err.schemaLoad', { message: message })));
        });
        function failSchema(error) {
            schemaError = error.message;
            $('#sd-schema-warning').text(t('err.unavailable', { message: error.message })).show();
            $ok.prop('disabled', true);
        }
    }
    function cancelEditor() {
        if (schemaRequest && schemaRequest.readyState !== 4) schemaRequest.abort();
        schemaRequest = null;
        nodeRef = null;
        loadedSchema = null;
        schemaError = null;
        list = null;
    }
    function buildSchemaForms(schema, node) {
        for (const section of sections) {
            const $target = $('#sd-fields-' + section).empty();
            for (const [key, field] of Object.entries(schema[section])) $target.append(controlFor(section, key, field));
            for (const [key, field] of Object.entries(schema[section])) {
                const $input = $target.find('[data-section="' + section + '"][data-key="' + key + '"]');
                const value = node[section] && Object.prototype.hasOwnProperty.call(node[section], key) ? node[section][key] : defaultFor(field);
                if (field.type === 'boolean') $input.prop('checked', value === true);
                else $input.val(value);
                if (field.type === 'color') syncPicker($input);
            }
        }
        attachResets();
    }
    function actionValue(action, key, field) {
        return Object.prototype.hasOwnProperty.call(action, key) ? action[key] : defaultFor(field);
    }
    function buildActionList(schema, actions) {
        const $list = $('#node-input-actions-list').empty();
        if ($list.data('editableList')) $list.editableList('destroy');
        list = $list.editableList({
            addButton: t('actions.add'),
            removable: true,
            sortable: true,
            height: 'auto',
            addItem: function (container, index, action) {
                const item = $.extend(true, {}, action || {});
                if (!item.id) item.id = makeId();
                const $row = $('<div class="sd-action"></div>').appendTo(container);
                $row.data('action', item);
                const $head = $('<div class="sd-action-head"><button type="button" class="sd-toggle" aria-expanded="true">&#9662;</button><span class="sd-action-title"></span><button type="button" class="sd-copy">&#10697;</button></div>').appendTo($row);
                $head.find('.sd-toggle').attr('aria-label', t('actions.collapse'));
                $head.find('.sd-copy').attr({ title: t('actions.duplicate'), 'aria-label': t('actions.duplicate') });
                const $grid = $('<div class="sd-action-grid"></div>').appendTo($row);
                $head.on('click', '.sd-toggle, .sd-action-title', function () { setCollapsed($row, $grid.is(':visible')); });
                $head.on('click', '.sd-copy', function () { duplicateAction($row); });
                for (const [key, field] of Object.entries(schema.action)) {
                    const value = actionValue(item, key, field);
                    if (key === 'visible' || key === 'enabled') {
                        const id = 'sd-action-' + key + '-' + index;
                        $('<label class="sd-check" for="' + id + '"><input id="' + id + '" type="checkbox" data-action-key="' + key + '"> ' + fieldTitle(key) + '</label>').appendTo($grid).find('input').prop('checked', value === true);
                    } else if (key === 'payload') {
                        const payloadType = types.includes(item.payloadType) ? item.payloadType :
                            typeof item.payload === 'string' ? 'str' : typeof item.payload === 'number' ? 'num' : typeof item.payload === 'boolean' ? 'bool' : 'json';
                        let payloadText = item.payload;
                        if (payloadType === 'json' && typeof payloadText !== 'string') payloadText = JSON.stringify(payloadText === undefined ? null : payloadText, null, 2);
                        else if (payloadText === undefined || payloadText === null) payloadText = payloadType === 'json' ? 'null' : '';
                        const id = 'sd-action-payload-' + index;
                        $('<div class="sd-action-wide"><label for="' + id + '">' + esc(fieldTitle('payload')) + ' <span class="sd-required">' + esc(t('required')) + '</span></label><input id="' + id + '" class="sd-payload" data-action-key="payload" type="text"></div>').appendTo($grid);
                        const $payload = $grid.find('#' + id);
                        $payload.typedInput({ default: payloadType, types: types });
                        $payload.typedInput('type', payloadType);
                        $payload.typedInput('value', String(payloadText));
                    } else {
                        const id = 'sd-action-' + key + '-' + index;
                        const label = fieldTitle(key) + (field.required ? ' <span class="sd-required">' + esc(t('required')) + '</span>' : '');
                        const type = key === 'topic' ? 'text' : 'text';
                        $('<div class="sd-action-field' + (field.type === 'color' ? ' sd-color-field' : '') + '"><label for="' + id + '">' + label + '</label><input id="' + id + '" type="' + type + '" data-action-key="' + key + '">' + (field.type === 'color' ? colorPicker() : '') + '</div>').appendTo($grid).find('[data-action-key]').val(value == null ? '' : value);
                        if (field.type === 'color') syncPicker($grid.find('#' + id));
                    }
                }
                $('<div class="sd-action-error" aria-live="polite"></div>').appendTo($row);
                $row.on('input change', 'input,select', function () { updateActionTitle($row); validateEditor(); });
                updateActionTitle($row);
                window.setTimeout(validateEditor, 0);
            },
            removeItem: function () { window.setTimeout(validateEditor, 0); },
            sort: function () { window.setTimeout(validateEditor, 0); }
        });
        (actions || []).forEach(function (action, index) { $list.editableList('addItem', action); });
    }
    function updateActionTitle($row) {
        const label = $row.find('[data-action-key="label"]').val() || '';
        const id = $row.find('[data-action-key="id"]').val() || '';
        const flags = ($row.find('[data-action-key="visible"]').prop('checked') === false ? t('actions.hidden') : '') + ($row.find('[data-action-key="enabled"]').prop('checked') === false ? t('actions.disabled') : '');
        $row.find('.sd-action-title').text((label || t('actions.noLabel')) + ' \u2014 ' + id + flags);
    }
    function setCollapsed($row, collapsed) {
        $row.find('.sd-action-grid').toggle(!collapsed);
        $row.find('.sd-toggle').attr('aria-expanded', String(!collapsed)).attr('aria-label', collapsed ? t('actions.expand') : t('actions.collapse')).html(collapsed ? '&#9656;' : '&#9662;');
        $row.toggleClass('sd-collapsed', collapsed);
    }
    function readActionRow($row) {
        const action = {};
        $row.find('[data-action-key]').each(function () {
            const $input = $(this);
            const key = $input.attr('data-action-key');
            if (key === 'payload') { action.payloadType = $input.typedInput('type'); action.payload = $input.typedInput('value'); }
            else if ($input.attr('type') === 'checkbox') action[key] = $input.prop('checked');
            else action[key] = String($input.val() == null ? '' : $input.val());
        });
        if (action.topic === '') delete action.topic;
        return action;
    }
    function uniqueCopyId(base) {
        const ids = new Set();
        $('#node-input-actions-list .sd-action [data-action-key="id"]').each(function () { ids.add($(this).val()); });
        base = base.replace(/-copy(-[0-9]+)?$/, '') || base;
        let candidate = base.slice(0, 59) + '-copy';
        for (let n = 2; ids.has(candidate); n += 1) candidate = base.slice(0, 52) + '-copy-' + n;
        return candidate;
    }
    function duplicateAction($row) {
        const copy = readActionRow($row);
        copy.id = uniqueCopyId(copy.id || 'action');
        const $list = $('#node-input-actions-list');
        $list.editableList('addItem', copy);
        const $new = $list.find('.sd-action').filter(function () { return $(this).find('[data-action-key="id"]').val() === copy.id; }).first();
        $new.closest('li').insertAfter($row.closest('li'));
        setCollapsed($new, false);
        $new.find('[data-action-key="label"]').trigger('focus');
        validateEditor();
    }
    function bindEditorEvents() {
        $('#node-input-scope').off('.speedDial').on('change.speedDial', function () { updateScope(); validateEditor(); });
        $('#sd-editor').off('.speedDial').on('input.speedDial change.speedDial', 'input,select', function () {
            const $el = $(this);
            if ($el.hasClass('sd-color-picker')) {
                const $text = $el.siblings('input[type=text]').first();
                $text.val($el.val()).trigger('input');
                $el.removeClass('sd-color-empty');
                return;
            }
            if ($el.attr('type') === 'text' && $el.siblings('.sd-color-picker').length) syncPicker($el);
            if ($el.attr('type') === 'number') updateReset($el);
            const section = $el.data('section');
            const key = $el.data('key');
            if ((section === 'menu' && (key === 'mode' || key === 'shape' || key === 'direction')) || (section === 'button' && key === 'position')) updateMenuMode();
            validateEditor();
        });
        $('#sd-editor').on('click.speedDial', '.sd-reset', function () {
            const $input = $(this).siblings('input[type=number]').first();
            $input.val($input.attr('data-default')).trigger('input');
            $input.trigger('focus');
        });
        $('#sd-editor').on('click.speedDial', '.sd-color-clear', function () {
            const $text = $(this).siblings('input[type=text]').first();
            $text.val('').trigger('input');
        });
        $('#sd-tab-bar').off('.speedDial').on('click.speedDial', 'button', function () {
            const pane = $(this).attr('data-pane');
            $('#sd-tab-bar button').removeClass('active').attr('aria-selected', 'false');
            $(this).addClass('active').attr('aria-selected', 'true');
            $('.sd-tab-pane').removeClass('active').attr('hidden', true);
            $('#sd-pane-' + pane).addClass('active').removeAttr('hidden');
        });
        $('#sd-collapse-all').off('.speedDial').on('click.speedDial', function () { $('#node-input-actions-list .sd-action').each(function () { setCollapsed($(this), true); }); });
        $('#sd-expand-all').off('.speedDial').on('click.speedDial', function () { $('#node-input-actions-list .sd-action').each(function () { setCollapsed($(this), false); }); });
        attachResets();
        updateScope();
        updateMenuMode();
    }
    function updateScope() {
        const scope = $('#node-input-scope').val() || 'page';
        $('#sd-ref-group').toggle(scope === 'group');
        $('#sd-ref-page').toggle(scope === 'page');
        $('#sd-ref-ui').toggle(scope === 'all');
        $('.sd-group-size').toggle(scope === 'group');
    }
    function directionChoices(shape, position) {
        const g = loadedSchema.geometry;
        if (shape === 'linear') return g.directions.linear;
        if (shape === 'circle') return [];
        return (g.corners[position] && g.corners[position][shape]) || g.directions[shape];
    }
    function updateMenuMode() {
        if (!loadedSchema) return;
        const isMenu = $('#sd-menu-mode').val() === 'menu';
        if (isMenu) $('#sd-menu-shape').val('linear');
        const shape = $('#sd-menu-shape').val();
        const choices = directionChoices(shape, $('#sd-button-position').val());
        const $dir = $('#sd-menu-direction');
        if (choices.length) {
            const current = $dir.val();
            $dir.empty();
            choices.forEach(function (v) { $dir.append($('<option>').attr('value', v).text(v)); });
            $dir.val(choices.includes(current) ? current : choices[0]);
        } else if (!$dir.find('option[value="' + $dir.val() + '"]').length) {
            $dir.val(loadedSchema.menu.direction.default);
        }
        const row = function (k) { return $('[data-schema-section="menu"][data-schema-key="' + k + '"]'); };
        const position = $('#sd-button-position').val() || '';
        const centeredX = position === 'center' || position.endsWith('-center');
        const centeredY = position === 'center' || position.startsWith('center');
        $('[data-schema-section="button"][data-schema-key="offsetX"]').toggle(!centeredX);
        $('[data-schema-section="button"][data-schema-key="offsetY"]').toggle(!centeredY);
        row('shape').toggle(!isMenu);
        row('direction').toggle(shape !== 'circle');
        row('radius').toggle(!isMenu && shape !== 'linear');
        row('showLabels').toggle(!isMenu && shape === 'linear');
        if (isMenu || shape !== 'linear') $('#sd-menu-showLabels').prop('checked', false);
    }
    function readValue($input, field, label) {
        let value;
        if (field.type === 'boolean') value = $input.prop('checked');
        else if (field.type === 'number') {
            if ($input.val() === '') throw new Error(t('err.required', { label: label }));
            value = Number($input.val());
        } else value = String($input.val() == null ? '' : $input.val());
        validateField(value, field, label);
        return value;
    }
    function collectConfig() {
        const config = { actions: collectActions(), button: {}, menu: {}, theme: {} };
        for (const section of sections) {
            for (const [key, field] of Object.entries(loadedSchema[section])) {
                const $input = $('#sd-' + section + '-' + key);
                config[section][key] = readValue($input, field, section + '.' + key);
            }
        }
        return config;
    }
    function collectActions() {
        const actions = [];
        $('#node-input-actions-list').editableList('items').each(function () {
            const $row = $(this).find('.sd-action');
            const action = {};
            const values = {};
            $row.find('[data-action-key]').each(function () {
                const $input = $(this);
                const key = $input.attr('data-action-key');
                const field = loadedSchema.action[key];
                if (key === 'payload') {
                    const type = $input.typedInput('type');
                    const text = $input.typedInput('value');
                    action.payloadType = type;
                    action.payload = text;
                    values.payload = parsePayload(type, text, actions.length);
                } else if (field.type === 'boolean') values[key] = $input.prop('checked');
                else values[key] = String($input.val() == null ? '' : $input.val());
            });
            for (const [key, field] of Object.entries(loadedSchema.action)) {
                if (key === 'payload') continue;
                const value = Object.prototype.hasOwnProperty.call(values, key) ? values[key] : defaultFor(field);
                if (key === 'topic' && value === '') continue;
                validateField(value, field, 'actions[' + actions.length + '].' + key);
                action[key] = value;
            }
            if (!Object.prototype.hasOwnProperty.call(action, 'id')) throw new Error(t('err.needId'));
            if (!Object.prototype.hasOwnProperty.call(values, 'payload')) throw new Error(t('err.required', { label: 'actions[' + actions.length + '].payload' }));
            action.payloadType = action.payloadType || 'json';
            action.payload = action.payloadType === 'str' || action.payloadType === 'json' ? String(action.payload) : String(action.payload);
            actions.push(action);
        });
        if (actions.length > loadedSchema.limits.actions) throw new Error(t('err.maxActions', { max: loadedSchema.limits.actions }));
        const ids = new Set();
        actions.forEach(function (action, i) {
            if (ids.has(action.id)) throw new Error(t('err.dupId', { id: action.id }));
            ids.add(action.id);
            // Parsing and limits are checked here while keeping the editable JSON text for the runtime converter.
            const value = parsePayload(action.payloadType, action.payload, i);
            const serialized = JSON.stringify(value);
            if (new TextEncoder().encode(serialized).length > loadedSchema.limits.jsonBytes) throw new Error(t('err.payloadSize', { label: 'actions[' + i + '].payload' }));
            checkDepth(value, 0, loadedSchema.limits.jsonDepth, 'actions[' + i + '].payload');
        });
        return actions;
    }
    function parsePayload(type, text, index) {
        const label = 'actions[' + index + '].payload';
        if (type === 'str') return String(text);
        if (type === 'bool') {
            if (text !== 'true' && text !== 'false') throw new Error(t('err.bool', { label: label }));
            return text === 'true';
        }
        let value;
        try { value = JSON.parse(text); } catch (error) { throw new Error(t(type === 'num' ? 'err.number' : 'err.json', { label: label })); }
        if (type === 'num' && (typeof value !== 'number' || !Number.isFinite(value))) throw new Error(t('err.finite', { label: label }));
        validateJsonValue(value, label, 0, loadedSchema.limits.jsonDepth);
        return value;
    }
    function validateJsonValue(value, label, depth, maxDepth) {
        if (depth > maxDepth) throw new Error(t('err.depth', { label: label }));
        if (value === null || typeof value === 'string' || typeof value === 'boolean') return;
        if (typeof value === 'number') { if (!Number.isFinite(value)) throw new Error(t('err.finiteNumbers', { label: label })); return; }
        if (Array.isArray(value)) { value.forEach((v, i) => validateJsonValue(v, label + '[' + i + ']', depth + 1, maxDepth)); return; }
        if (value && Object.getPrototypeOf(value) === Object.prototype) { Object.keys(value).forEach(k => validateJsonValue(value[k], label + '.' + k, depth + 1, maxDepth)); return; }
        throw new Error(t('err.notJson', { label: label }));
    }
    function checkDepth(value, depth, maxDepth, label) { validateJsonValue(value, label, depth, maxDepth); }
    function validateField(value, field, label) {
        const fail = function (key, extra) { throw new Error(t(key, Object.assign({ label: label }, extra))); };
        switch (field.type) {
        case 'string':
            if (typeof value !== 'string') fail('err.text');
            if (field.max !== undefined && value.length > field.max) fail('err.maxChars', { max: field.max });
            break;
        case 'number':
            if (typeof value !== 'number' || !Number.isFinite(value)) fail('err.finite');
            if (field.min !== undefined && value < field.min) fail('err.min', { min: field.min });
            if (field.max !== undefined && value > field.max) fail('err.max', { max: field.max });
            break;
        case 'boolean': if (typeof value !== 'boolean') fail('err.onoff'); break;
        case 'enum': if (!field.values.includes(value)) fail('err.oneOf', { values: field.values.join(', ') }); break;
        case 'icon': if (typeof value !== 'string' || (value !== '' && !/^pi-[a-z0-9-]+$/.test(value))) fail('err.icon'); break;
        case 'color': if (typeof value !== 'string' || (value !== '' && !/^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/.test(value))) fail('err.color'); break;
        case 'id': if (typeof value !== 'string' || !/^[A-Za-z0-9][A-Za-z0-9_.:-]{0,63}$/.test(value)) fail('err.idFormat'); break;
        case 'json': break;
        default: throw new Error(t('err.unsupported', { type: field.type }));
        }
    }
    function validateEditor() {
        const $ok = $('#node-dialog-ok');
        if (schemaError || !loadedSchema) { $ok.prop('disabled', true); return false; }
        try {
            const scope = $('#node-input-scope').val();
            if (!['group', 'page', 'all'].includes(scope)) throw new Error(t('err.scope'));
            const ref = scope === 'group' ? $('#node-input-group').val() : scope === 'page' ? $('#node-input-page').val() : $('#node-input-ui').val();
            if (!ref) throw new Error(t('err.selectRef', { what: t(scope === 'group' ? 'ref.group' : scope === 'page' ? 'ref.page' : 'ref.ui') }));
            const cfg = collectConfig();
            const allowedDirections = loadedSchema.geometry.directions[cfg.menu.shape];
            if (allowedDirections && allowedDirections.length && !allowedDirections.includes(cfg.menu.direction)) throw new Error(t('err.directionShape', { direction: cfg.menu.direction, shape: cfg.menu.shape }));
            // The editor sends payloadType plus text; validate the same JSON envelope the runtime receives.
            const runtimeActions = cfg.actions.map(function (action, i) {
                const converted = Object.assign({}, action, { payload: parsePayload(action.payloadType, action.payload, i) });
                delete converted.payloadType;
                return converted;
            });
            const envelope = { actions: runtimeActions, button: cfg.button, menu: cfg.menu, theme: cfg.theme };
            const serialized = JSON.stringify(envelope);
            if (new TextEncoder().encode(serialized).length > loadedSchema.limits.jsonBytes) throw new Error(t('err.configSize'));
            $('#sd-validation-error').hide().text('');
            $('#node-input-actions-list').editableList('items').each(function () { $(this).find('.sd-action-error').text(''); });
            $ok.prop('disabled', false);
            return true;
        } catch (error) {
            $('#sd-validation-error').text(error.message).show();
            $ok.prop('disabled', true);
            return false;
        }
    }
    function saveEditor(node) {
        if (!validateEditor()) return;
        const config = collectConfig();
        node.actions = config.actions;
        for (const section of sections) node[section] = config[section];
        node.scope = $('#node-input-scope').val();
        // Let Node-RED save config-node references and maintain their users lists.
        if (node.scope !== 'group') $('#node-input-group').val('');
        if (node.scope !== 'page') $('#node-input-page').val('');
        if (node.scope !== 'all') $('#node-input-ui').val('');
        node.order = Number($('#node-input-order').val());
        node.width = Number($('#node-input-width').val());
        node.height = Number($('#node-input-height').val());
    }
}());
</script>
