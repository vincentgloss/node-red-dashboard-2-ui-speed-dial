<script type="text/javascript">
/* global RED, $, document, window */
(function () {
    const NS = 'node-red-dashboard-2-ui-speed-dial/ui-speed-dial:';
    const SECTIONS = ['button', 'menu', 'theme'];
    const PAYLOAD_TYPES = ['str', 'num', 'bool', 'json'];
    const POSITIONS = ['top-left', 'top-center', 'top-right', 'center-left', 'center', 'center-right', 'bottom-left', 'bottom-center', 'bottom-right'];
    // One style card sets menu.mode, menu.shape and menu.showLabels together.
    const STYLES = {
        row: { mode: 'speed-dial', shape: 'linear', showLabels: false },
        'row-labels': { mode: 'speed-dial', shape: 'linear', showLabels: true },
        list: { mode: 'menu', shape: 'linear', showLabels: false },
        'semi-circle': { mode: 'speed-dial', shape: 'semi-circle', showLabels: false },
        'quarter-circle': { mode: 'speed-dial', shape: 'quarter-circle', showLabels: false },
        circle: { mode: 'speed-dial', shape: 'circle', showLabels: false }
    };
    const dot = function (x, y, r) { return '<circle cx="' + x + '" cy="' + y + '" r="' + (r || 3) + '"' + (r ? '' : ' class="a"') + '/>'; };
    const bar = function (x, y, w) { return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="3" rx="1.5" class="a"/>'; };
    const STYLE_PREVIEWS = {
        row: dot(44, 31, 6) + dot(44, 20) + dot(44, 12.5) + dot(44, 5),
        'row-labels': dot(44, 31, 6) + dot(44, 20) + dot(44, 12.5) + dot(44, 5) + bar(24, 18.5, 15) + bar(24, 11, 15) + bar(24, 3.5, 15),
        list: dot(44, 31, 6) + '<rect x="8" y="2" width="42" height="21" rx="3" class="o"/>' + bar(12, 6, 30) + bar(12, 11, 30) + bar(12, 16, 30),
        'semi-circle': dot(28, 32, 6) + dot(12, 32) + dot(16.7, 20.7) + dot(28, 16) + dot(39.3, 20.7) + dot(44, 32),
        'quarter-circle': dot(46, 32, 6) + dot(26, 32) + dot(31.9, 17.9) + dot(46, 12),
        circle: dot(28, 20, 6) + dot(42, 20) + dot(35, 32.1) + dot(21, 32.1) + dot(14, 20) + dot(21, 7.9) + dot(35, 7.9)
    };
    const SIZE_PRESETS = { s: 40, m: 56, l: 72 };
    const DIRECTION_ANGLES = { up: 0, 'up-right': 45, right: 90, 'down-right': 135, down: 180, 'down-left': 225, left: 270, 'up-left': 315 };
    const DASHBOARD_PRIMARY = '#0d74ce';
    // Error colour of the Dashboard theme, the default of the counter badge.
    const DASHBOARD_ERROR = '#ff5252';
    // Inline colour swatches; anything else comes from "custom" (the browser's colour dialog) or the hex field.
    const PREVIEW_HEIGHT = 340;
    // Height of the Dashboard app bar (Vuetify default).
    const PREVIEW_HEADER = 64;
    const PREVIEW_MIN_WIDTH = 420;
    const PREVIEW_EXAMPLE_ICONS = ['pi-home', 'pi-lightbulb', 'pi-bell', 'pi-cog', 'pi-star'];
    // Fully transparent, as an 8-digit hex value the runtime already accepts.
    const COLOR_TRANSPARENT = '#00000000';
    const COLOR_PALETTE = ['#dc2626', '#ea580c', '#d97706', '#16a34a', '#0d9488', '#0284c7', '#2563eb', '#7c3aed', '#db2777', '#475569', '#0f172a', '#ffffff'];
    // Node-RED serves the package's resources/ folder to the editor.
    const ICON_FONT = 'resources/node-red-dashboard-2-ui-speed-dial/primeicons.woff2';
    // Material Design Icons: font and names of the installed Dashboard, served by this node.
    const MDI_FONT = 'ui-speed-dial/mdi.woff2';
    const ICON_GRID_LIMIT = 400;
    // Same rules as lib/protocol.js.
    const ICON_NAME = /^(?:pi|mdi)-[a-z0-9-]+$/;
    const ICON_URL = /^(?:https?:\/\/|\/)[^\s"'()\\<>]{1,2047}$/;
    const ICON_DATA = /^data:image\/(?:svg\+xml|png|gif|webp|jpeg);base64,[A-Za-z0-9+/]+={0,2}$/;

    let schema = null;
    let icons = null;
    // null = not requested yet, 'loading', 'failed' or the name -> code point map; kept for the editor session.
    let mdiIcons = null;
    let request = null;
    let session = 0;
    let rowSeq = 0;
    // Values of fields the dialog no longer shows (e.g. theme.mode); kept on save unless the user removes them.
    let preserved = {};
    let dropPreserved = false;
    let previewOpen = false;
    // Page ids chosen for "selected pages"; survives switching the dashboard while the dialog is open.
    let pageSelection = new Set();
    let previewMessage = '';

    // Same palette section as the Dashboard 2 widgets (localized by the dashboard itself).
    function dashboardCategory() {
        const label = RED._('@flowfuse/node-red-dashboard/ui-base:ui-base.label.category');
        return label && label.indexOf(':') === -1 ? label : 'Dashboard 2';
    }
    RED.nodes.registerType('ui-speed-dial', {
        category: dashboardCategory(),
        color: '#a6bbcf',
        defaults: {
            name: { value: '' },
            scope: { value: 'page' },
            // Where the button is shown: in a group, floating over the page or in the Dashboard header.
            placement: { value: 'float' },
            // In the header: "actions" (right side) or "title" (next to the page title).
            headerSlot: { value: 'actions' },
            // Page ids for scope "pages" (selected pages of one dashboard).
            pages: { value: [], validate: function (v) { return this.scope !== 'pages' || (Array.isArray(v) && v.length > 0); } },
            group: { value: '', type: 'ui-group', validate: function (v) { return this.scope !== 'group' || !!v; } },
            page: { value: '', type: 'ui-page', validate: function (v) { return this.scope !== 'page' || !!v; } },
            ui: { value: '', type: 'ui-base', validate: function (v) { return (this.scope !== 'all' && this.scope !== 'pages') || !!v; } },
            order: { value: 0 },
            width: { value: 0 },
            height: { value: 0 },
            actions: { value: [] },
            button: { value: {} },
            menu: { value: {} },
            theme: { value: {} }
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-plus',
        paletteLabel: 'speed dial',
        label: function () { return this.name || 'speed dial'; },
        oneditprepare: function () { prepareEditor(this); },
        oneditcancel: function () { cancelEditor(); },
        oneditsave: function () { saveEditor(this); }
    });

    // ---- helpers -------------------------------------------------------------------------------------------
    // Translations live in nodes/locales/<lang>/ui-speed-dial.json (namespace <package>/<node file>).
    function t(key, options) {
        const text = RED._(NS + key, options);
        return text === NS + key || text === key ? key : text;
    }
    function esc(value) { return $('<div>').text(String(value)).html(); }
    function has(object, key) { return !!object && Object.prototype.hasOwnProperty.call(object, key); }
    function defaultFor(field) { return has(field, 'default') ? field.default : ''; }
    function control(section, key) { return $('#sd-' + section + '-' + key); }
    function rowOf($el) { return $el.closest('.form-row'); }
    function codePoint(map, name) { return map && typeof map === 'object' && map[name] ? String.fromCodePoint(parseInt(map[name], 16)) : ''; }
    function isIconValue(value) {
        if (value === '') return true;
        if (ICON_NAME.test(value)) {
            const map = value.startsWith('pi-') ? icons : mdiIcons;
            return !map || typeof map !== 'object' || has(map, value);
        }
        return ICON_URL.test(value) || (value.length <= schema.limits.iconImageChars && ICON_DATA.test(value));
    }
    function iconName(value) {
        if (!value) return t('icon.none');
        if (ICON_NAME.test(value)) return value.replace(/^(pi|mdi)-/, '');
        if (value.startsWith('data:')) return t('icon.ownImage');
        return value.split(/[/?#]/).filter(Boolean).pop() || value;
    }
    // Fills a .sd-icon span: a font glyph for pi-/mdi- names, otherwise the image as a colour mask (as in the dashboard).
    function renderIcon($el, value) {
        $el.attr('data-sd-icon', value || '').removeClass('sd-glyph sd-glyph-mdi sd-img').text('').css({ 'mask-image': '', '-webkit-mask-image': '' });
        if (!value) return $el;
        if (value.startsWith('pi-')) return $el.addClass('sd-glyph').text(codePoint(icons, value));
        if (value.startsWith('mdi-')) {
            loadMdiIcons();
            return $el.addClass('sd-glyph sd-glyph-mdi').text(codePoint(mdiIcons, value));
        }
        if (ICON_URL.test(value) || ICON_DATA.test(value)) $el.addClass('sd-img').css({ 'mask-image': 'url("' + value + '")', '-webkit-mask-image': 'url("' + value + '")' });
        return $el;
    }
    function loadMdiIcons() {
        if (mdiIcons !== null && mdiIcons !== 'failed') return;
        mdiIcons = 'loading';
        $.getJSON('ui-speed-dial/mdi-icons').done(function (map) {
            mdiIcons = map && typeof map === 'object' && Object.keys(map).length ? map : 'failed';
        }).fail(function () { mdiIcons = 'failed'; }).always(function () {
            $('#sd-editor [data-sd-icon]').each(function () { renderIcon($(this), $(this).attr('data-sd-icon')); });
            $('#sd-editor [data-section="button"][data-key="icon"], #sd-editor [data-section="button"][data-key="closeIcon"], #sd-editor [data-action-key="icon"]').each(function () {
                const refresh = $(this).data('refreshIcon');
                if (refresh) refresh();
            });
            if (schema) validateEditor();
        });
    }
    function isSchema(value) { return !!(value && value.button && value.menu && value.theme && value.action && value.limits && value.geometry); }
    function bytes(text) { return new TextEncoder().encode(text).length; }
    function applyI18n() {
        $('#sd-editor [data-sd-i18n]').each(function () { $(this).html(t($(this).attr('data-sd-i18n'))); });
        $('#sd-editor [data-sd-i18n-placeholder]').each(function () { $(this).attr('placeholder', t($(this).attr('data-sd-i18n-placeholder'))); });
        $('#sd-editor [data-sd-i18n-title]').each(function () { const text = t($(this).attr('data-sd-i18n-title')); $(this).attr({ title: text, 'aria-label': text }); });
    }
    function ensureIconFont() {
        if (document.getElementById('sd-icon-font')) return;
        $('<style id="sd-icon-font"></style>').text('@font-face{font-family:"sd-primeicons";font-display:block;src:url("' + ICON_FONT + '") format("woff2")}' +
            '@font-face{font-family:"sd-mdi";font-display:block;src:url("' + MDI_FONT + '") format("woff2")}').appendTo(document.head);
    }
    // Same rule as the widget: dark text on light backgrounds, white on dark ones.
    function isTransparent(hex) { return /^#[0-9a-f]{6}[0-7][0-9a-f]$/i.test(hex || ''); }
    // Mostly transparent backgrounds return '' so the caller keeps the colour of what is behind them.
    function contrastColor(hex) {
        const match = /^#([0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/i.exec(hex || '');
        if (!match || isTransparent(hex)) return '';
        const h = match[1].length === 3 ? match[1].replace(/./g, '$&$&') : match[1];
        const [r, g, b] = [0, 2, 4].map(function (i) { const c = parseInt(h.slice(i, i + 2), 16) / 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); });
        return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.179 ? '#0f172a' : '#ffffff';
    }
    function hexForPicker(text) {
        const match = /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/.exec(text || '');
        if (!match) return null;
        const h = match[1].length === 3 ? match[1].replace(/./g, '$&$&') : match[1];
        return '#' + h.slice(0, 6).toLowerCase();
    }
    // Colours of the Dashboard theme that the selected group / page / UI uses (defaults of Dashboard 2 otherwise).
    function dashboardTheme() {
        const result = { primary: DASHBOARD_PRIMARY, surface: '#ffffff', page: '#f9f9fb', header: '#fcfcfd', title: '' };
        try {
            const scope = $('#node-input-scope').val();
            let page = null;
            if (scope === 'group') { const group = RED.nodes.node($('#node-input-group').val()); page = group && RED.nodes.node(group.page); }
            else if (scope === 'page') page = RED.nodes.node($('#node-input-page').val());
            else if (scope === 'pages' && selectedPages().length) page = RED.nodes.node(selectedPages()[0]);
            if (!page && scope !== 'group' && scope !== 'page') {
                const ui = $('#node-input-ui').val();
                RED.nodes.eachConfig(function (n) { if (!page && n.type === 'ui-page' && n.ui === ui) page = n; });
            }
            const theme = page && page.theme && RED.nodes.node(page.theme);
            const colors = (theme && theme.colors) || {};
            if (hexForPicker(colors.primary)) result.primary = colors.primary;
            if (hexForPicker(colors.groupBg)) result.surface = colors.groupBg;
            if (hexForPicker(colors.bgPage)) result.page = colors.bgPage;
            // ui-theme "surface" is the header and navigation colour of the Dashboard.
            if (hexForPicker(colors.surface)) result.header = colors.surface;
            result.title = (page && (page.name || page.path)) || '';
        } catch (error) { /* keep the defaults */ }
        return result;
    }
    function dashboardPrimary() { return dashboardTheme().primary; }
    // Readable, stable action id from a label: "Licht an" -> "licht-an".
    function slug(text) {
        const umlauts = { 'ä': 'ae', 'ö': 'oe', 'ü': 'ue', 'ß': 'ss' };
        const value = String(text || '').toLowerCase().replace(/[äöüß]/g, function (c) { return umlauts[c]; })
            .normalize('NFKD').replace(/[̀-ͯ]/g, '')
            .replace(/[^a-z0-9_.:-]+/g, '-').replace(/^[^a-z0-9]+/, '').replace(/-+$/, '').slice(0, 64).replace(/-+$/, '');
        return value || 'action';
    }
    function uniqueId(base, $self) {
        const ids = new Set();
        $('#node-input-actions-list .sd-action').not($self || []).each(function () { ids.add($(this).find('[data-action-key="id"]').val()); });
        if (!ids.has(base)) return base;
        for (let n = 2; ; n += 1) {
            const candidate = base.slice(0, 63 - String(n).length) + '-' + n;
            if (!ids.has(candidate)) return candidate;
        }
    }

    // ---- editor lifecycle ----------------------------------------------------------------------------------
    function prepareEditor(node) {
        const current = ++session;
        previewOpen = false;
        previewMessage = '';
        if (request) request.abort();
        schema = null;
        preserved = {};
        dropPreserved = false;
        const iconMap = RED.settings.uiSpeedDialIcons;
        icons = iconMap && typeof iconMap === 'object' && Object.keys(iconMap).length ? iconMap : null;
        applyI18n();
        ensureIconFont();
        setupSizer(node);
        setupPlacement(node);
        $('#node-dialog-ok').prop('disabled', true);
        showBanner(t('loading'), false);
        loadSchema(function (loaded) {
            if (current !== session) return;
            try {
                schema = loaded;
                buildForm(node);
                buildActionList(node.actions || []);
                bindEvents();
                $('#sd-banner').hide();
                updateDependent();
                validateEditor();
            } catch (error) { failed(error); }
        }, failed);
        function failed(error) {
            if (current !== session) return;
            schema = null;
            showBanner(t('err.unavailable', { message: error.message }), true);
            $('#node-dialog-ok').prop('disabled', true);
        }
    }
    function loadSchema(done, fail) {
        if (isSchema(RED.settings.uiSpeedDialSchema)) { done(RED.settings.uiSpeedDialSchema); return; }
        // Editors opened before the node was installed have no node settings yet.
        request = $.getJSON('ui-speed-dial/schema');
        request.done(function (loaded) {
            request = null;
            if (isSchema(loaded)) done(loaded);
            else fail(new Error(t('err.schemaIncomplete')));
        }).fail(function (xhr, status) {
            request = null;
            if (status !== 'abort') fail(new Error(xhr && xhr.status ? t('err.http', { status: xhr.status }) : t('err.network')));
        });
    }
    function cancelEditor() {
        session += 1;
        if (request) request.abort();
        request = null;
        schema = null;
    }
    function showBanner(text, error) {
        $('#sd-banner').text(text).toggleClass('sd-banner-error', !!error).show();
    }
    // The size grid of the Dashboard widgets; numeric fields in subflows, as the built-in widgets do.
    function setupPlacement(node) {
        $('#node-input-placement').val(node.scope === 'group' ? 'group' : node.placement === 'header' ? 'header' : 'float');
        $('#sd-page-mode').val(node.scope === 'pages' ? 'pages' : node.scope === 'all' ? 'all' : 'page');
        $('#node-input-headerSlot').val(node.headerSlot === 'title' ? 'title' : 'actions');
        pageSelection = new Set(Array.isArray(node.pages) ? node.pages : []);
        $('#sd-page-list').data('missing', 0);
        syncScope();
        buildPageList();
    }
    function placementValue() { return $('#node-input-placement').val() || 'float'; }
    function headerSlotValue() { return $('#node-input-headerSlot').val() === 'title' ? 'title' : 'actions'; }
    function syncScope() {
        const scope = placementValue() === 'group' ? 'group' : $('#sd-page-mode').val() || 'page';
        $('#node-input-scope').val(scope);
        return scope;
    }
    function dashboardPages(ui) {
        const pages = [];
        RED.nodes.eachConfig(function (n) { if (n.type === 'ui-page' && n.ui === ui) pages.push(n); });
        return pages.sort(function (a, b) { return (Number(a.order) || 0) - (Number(b.order) || 0); });
    }
    function buildPageList() {
        const $list = $('#sd-page-list').empty();
        const pages = dashboardPages($('#node-input-ui').val());
        if (!pages.length) { $('<div class="sd-hint"></div>').text(t('pages.none')).appendTo($list); return; }
        pages.forEach(function (page) {
            const $option = $('<label class="sd-check sd-page-option"><input type="checkbox"> <span class="sd-page-name"></span> <span class="sd-page-path"></span></label>').appendTo($list);
            $option.find('input').attr('data-page', page.id).prop('checked', pageSelection.has(page.id));
            $option.find('.sd-page-name').text(page.name || page.path || page.id);
            $option.find('.sd-page-path').text(page.path || '');
        });
        // Stored ids of pages that were deleted meanwhile are dropped on save.
        const known = new Set();
        RED.nodes.eachConfig(function (n) { if (n.type === 'ui-page') known.add(n.id); });
        const missing = Array.from(pageSelection).filter(function (id) { return !known.has(id); }).length;
        if (missing) $('<div class="sd-hint"></div>').text(t('pages.missing', { count: missing })).appendTo($list);
    }
    function selectedPages() {
        return $('#sd-page-list input[data-page]').filter(':checked').map(function () { return $(this).attr('data-page'); }).get();
    }
    function setupSizer(node) {
        const inSubflow = !!(RED.nodes.subflow && RED.nodes.subflow(node.z));
        const sizer = !inSubflow && typeof $.fn.elementSizer === 'function';
        if (sizer) $('#node-input-size').elementSizer({ width: '#node-input-width', height: '#node-input-height', group: '#node-input-group' });
        else $('#node-input-width, #node-input-height').attr({ type: 'number', min: 0 });
        $('#sd-editor').data('sizer', sizer);
    }

    // ---- main form -----------------------------------------------------------------------------------------
    function writeControl($input, field, value) {
        if ($input.attr('type') === 'checkbox') $input.prop('checked', value === true);
        else if (field.type === 'boolean') $input.val(value === true ? 'true' : 'false');
        else $input.val(value === undefined || value === null ? '' : String(value));
        if ($input.hasClass('sd-color-text')) syncColor($input);
    }
    function readControl($input, field) {
        if ($input.attr('type') === 'checkbox') return $input.prop('checked');
        if (field.type === 'boolean') return $input.val() === 'true';
        if (field.type === 'number') {
            const raw = String($input.val() == null ? '' : $input.val()).trim();
            return raw === '' ? undefined : Number(raw);
        }
        return String($input.val() == null ? '' : $input.val());
    }
    function buildForm(node) {
        $('#sd-editor .sd-color-text').each(function () { enhanceColor($(this)); });
        const $direction = control('menu', 'direction').empty();
        schema.menu.direction.values.forEach(function (v) { $direction.append($('<option>').attr('value', v).text(t('direction.' + v))); });
        for (const section of SECTIONS) {
            const stored = Object.assign({}, node[section]);
            // Earlier versions saved the old fixed blue as an explicit value; it now means "use the Dashboard colour".
            if (section === 'button' && stored.background === '#2563eb' && stored.color === '#ffffff') { stored.background = ''; stored.color = ''; }
            for (const [key, field] of Object.entries(schema[section])) {
                const $input = control(section, key);
                if (!$input.length) {
                    if (has(stored, key) && JSON.stringify(stored[key]) !== JSON.stringify(defaultFor(field))) {
                        (preserved[section] = preserved[section] || {})[key] = stored[key];
                    }
                    continue;
                }
                writeControl($input, field, has(stored, key) ? stored[key] : defaultFor(field));
                if (field.type === 'number') $input.attr({ min: field.min, max: field.max, 'data-default': field.default });
            }
        }
        const offsetX = control('button', 'offsetX').val();
        $('#sd-offset').val(offsetX).attr({ min: schema.button.offsetX.min, max: schema.button.offsetX.max, 'data-default': schema.button.offsetX.default });
        $('#sd-offset-separate').prop('checked', offsetX !== control('button', 'offsetY').val());
        buildPositionGrid();
        buildStyleCards();
        iconPicker($('#sd-button-icon-slot'), $('#sd-button-icon-panel'), control('button', 'icon'));
        iconPicker($('#sd-button-closeIcon-slot'), $('#sd-button-closeIcon-panel'), control('button', 'closeIcon'), { noneLabel: t('icon.keep') });
        attachResets();
        showPreserved();
    }
    function buildPositionGrid() {
        const $grid = $('#sd-position-grid').empty();
        control('button', 'position').data('target', $grid);
        POSITIONS.forEach(function (p) {
            $('<button type="button" class="sd-pos" role="radio"><span></span></button>')
                .attr({ 'data-value': p, title: t('position.' + p), 'aria-label': t('position.' + p) }).appendTo($grid);
        });
    }
    function buildStyleCards() {
        const $cards = $('#sd-style-cards').empty();
        control('menu', 'mode').data('target', $cards);
        control('menu', 'shape').data('target', $cards);
        Object.keys(STYLES).forEach(function (id) {
            $('<button type="button" class="sd-style" role="radio"></button>')
                .attr({ 'data-value': id, title: t('style.' + id + '.hint') })
                .html('<svg viewBox="0 0 56 40" aria-hidden="true">' + STYLE_PREVIEWS[id] + '</svg><span>' + esc(t('style.' + id + '.label')) + '</span>')
                .appendTo($cards);
        });
    }
    function currentStyle() {
        if (control('menu', 'mode').val() === 'menu') return 'list';
        const shape = control('menu', 'shape').val();
        if (shape === 'linear') return control('menu', 'showLabels').val() === 'true' ? 'row-labels' : 'row';
        return shape;
    }
    function applyStyle(id) {
        const style = STYLES[id];
        control('menu', 'mode').val(style.mode);
        control('menu', 'shape').val(style.shape);
        control('menu', 'showLabels').val(String(style.showLabels)).trigger('change');
    }
    function directionChoices(shape, position) {
        const g = schema.geometry;
        if (shape === 'circle') return [];
        if (shape === 'linear') return g.directions.linear;
        return (g.corners[position] && g.corners[position][shape]) || g.directions[shape] || [];
    }
    // Shows only what applies to the current choices and keeps the visual pickers in sync.
    function updateDependent() {
        if (!schema) return;
        const scope = syncScope();
        const placement = placementValue();
        const header = placement === 'header';
        const sizer = $('#sd-editor').data('sizer');
        $('#sd-ref-group').toggle(scope === 'group');
        $('#sd-pages-row').toggle(scope !== 'group');
        $('#sd-ref-page').toggle(scope === 'page');
        $('#sd-ref-ui').toggle(scope === 'all' || scope === 'pages');
        $('#sd-pages-pick').toggle(scope === 'pages');
        $('.sd-size-sizer').toggle(scope === 'group' && sizer);
        $('.sd-size-numeric').toggle(scope === 'group' && !sizer);
        $('#sd-scope-hint').text(t('scopeHint.' + placement));
        $('#sd-position-hint').text(t(scope === 'group' ? 'hint.positionGroup' : 'hint.positionPage'));
        // In the header the place is given (right side of the app bar); position and edge distance do not apply.
        rowOf($('#sd-position-grid')).toggle(!header);
        $('#sd-header-slot-row').toggle(header);
        $('#sd-header-slot-buttons button').each(function () { $(this).toggleClass('selected', $(this).attr('data-slot') === headerSlotValue()); });
        $('#sd-position-hint').toggle(!header);
        const headerReady = Number(control('button', 'size').val()) === SIZE_PRESETS.s && String(control('button', 'background').val()).toLowerCase() === COLOR_TRANSPARENT;
        $('#sd-header-tip').toggle(header && !headerReady);

        const position = header ? (headerSlotValue() === 'title' ? 'top-left' : 'top-right') : control('button', 'position').val() || '';
        $('#sd-position-grid .sd-pos').each(function () {
            const on = $(this).attr('data-value') === position;
            $(this).toggleClass('active', on).attr('aria-checked', String(on));
        });
        $('#sd-position-name').text(position ? t('position.' + position) : '');
        const style = currentStyle();
        $('#sd-style-cards .sd-style').each(function () {
            const on = $(this).attr('data-value') === style;
            $(this).toggleClass('active', on).attr('aria-checked', String(on));
        });
        const size = Number(control('button', 'size').val());
        $('#sd-size-presets .sd-size-preset').each(function () { $(this).toggleClass('selected', SIZE_PRESETS[$(this).attr('data-size')] === size); });

        const mode = control('menu', 'mode').val();
        const shape = mode === 'menu' ? 'linear' : control('menu', 'shape').val();
        const $direction = control('menu', 'direction');
        const wanted = $direction.val();
        const choices = directionChoices(shape, position);
        $direction.empty().append($('<option value="auto">').text(t('direction.auto')));
        choices.forEach(function (v) { $direction.append($('<option>').attr('value', v).text(t('direction.' + v))); });
        $direction.val(choices.includes(wanted) ? wanted : 'auto');
        rowOf($direction).toggle(shape !== 'circle');
        $('#sd-direction-hint').toggle(shape !== 'circle');
        const $arrows = $('#sd-direction-buttons').empty();
        $direction.data('target', $arrows);
        ['auto'].concat(choices).forEach(function (value) {
            const $choice = $('<button type="button" class="red-ui-button toggle sd-direction" role="radio"></button>')
                .attr({ 'data-value': value, title: t('direction.' + value), 'aria-label': t('direction.' + value), 'aria-checked': String(value === $direction.val()) })
                .toggleClass('selected', value === $direction.val()).appendTo($arrows);
            if (value === 'auto') $choice.text(t('direction.auto'));
            else $('<i class="fa fa-arrow-up" aria-hidden="true"></i>').css('transform', 'rotate(' + DIRECTION_ANGLES[value] + 'deg)').appendTo($choice);
        });
        rowOf(control('menu', 'radius')).toggle(shape !== 'linear');

        const centeredX = position === 'center' || position.endsWith('-center');
        const centeredY = position === 'center' || position.startsWith('center');
        // With a centred axis only one distance applies, so there is nothing to split.
        const split = $('#sd-offset-separate').prop('checked') && !centeredX && !centeredY;
        $('#sd-offset-single').toggle(!split && !(centeredX && centeredY));
        $('#sd-offset-single label').text(t(centeredX ? 'field.offsetY' : centeredY ? 'field.offsetX' : 'field.offset'));
        if (!split && document.activeElement !== $('#sd-offset')[0]) $('#sd-offset').val(control('button', centeredX ? 'offsetY' : 'offsetX').val());
        $('#sd-offset-separate-row').toggle(!centeredX && !centeredY);
        rowOf(control('button', 'offsetX')).toggle(split && !header);
        rowOf(control('button', 'offsetY')).toggle(split && !header);
        if (header) { $('#sd-offset-single').hide(); $('#sd-offset-separate-row').hide(); }
        control('button', 'offsetX').data('target', split ? null : $('#sd-offset'));
        control('button', 'offsetY').data('target', split ? null : $('#sd-offset'));

        syncColor(control('button', 'background'));
    }
    function showPreserved() {
        const entries = [];
        Object.keys(preserved).forEach(function (section) {
            Object.keys(preserved[section]).forEach(function (key) { entries.push(section + '.' + key + ' = ' + JSON.stringify(preserved[section][key])); });
        });
        $('#sd-preserved').toggle(entries.length > 0 && !dropPreserved).find('.sd-preserved-list').text(entries.join(', '));
    }
    // A colour field: a row of swatches (default, palette, custom) plus a small hex field that holds the value.
    // data-kind of the wrapper names the default: "dashboard" (theme primary), "auto" (contrast) or "default".
    function colorControl(attrs, kind) {
        return '<span class="sd-color" data-kind="' + kind + '"><input type="text" class="sd-color-text" ' + attrs + '></span>';
    }
    function enhanceColor($text) {
        const $wrap = $text.closest('.sd-color');
        if ($wrap.find('.sd-swatches').length) return;
        const kind = $wrap.attr('data-kind') || 'default';
        const $swatches = $('<div class="sd-swatches" role="radiogroup"></div>');
        $('<button type="button" class="sd-swatch sd-swatch-default" role="radio" data-color=""><span class="sd-dot"></span><span class="sd-swatch-text"></span></button>')
            .attr('title', t('color.' + kind + 'Hint')).appendTo($swatches).find('.sd-swatch-text').text(t('color.' + kind));
        $('<button type="button" class="sd-swatch sd-swatch-transparent" role="radio"></button>')
            .attr({ 'data-color': COLOR_TRANSPARENT, title: t('color.transparent'), 'aria-label': t('color.transparent') }).appendTo($swatches);
        COLOR_PALETTE.forEach(function (color) {
            $('<button type="button" class="sd-swatch" role="radio"></button>').attr({ 'data-color': color, title: color, 'aria-label': color }).css('background-color', color).appendTo($swatches);
        });
        $('<label class="sd-swatch sd-swatch-custom"><i class="fa fa-eyedropper" aria-hidden="true"></i><input type="color" class="sd-color-picker"></label>')
            .attr('title', t('color.custom')).appendTo($swatches).find('input').attr('aria-label', t('color.custom'));
        $swatches.prependTo($wrap);
        $text.attr({ placeholder: '#rrggbb', 'aria-label': t('color.hex'), title: t('color.hexHint') });
        syncColor($text);
    }
    function syncColor($text) {
        if (!$text || !$text.length) return;
        const $wrap = $text.closest('.sd-color');
        const value = String($text.val() || '').trim();
        const hex = hexForPicker(value);
        const inPalette = COLOR_PALETTE.includes(value.toLowerCase()) || value.toLowerCase() === COLOR_TRANSPARENT;
        const custom = value !== '' && !inPalette;
        $wrap.find('.sd-swatch').each(function () {
            const color = $(this).attr('data-color');
            const on = color === undefined ? custom : color === '' ? value === '' : color === value.toLowerCase();
            $(this).toggleClass('active', on).attr('aria-checked', String(on));
        });
        $wrap.find('.sd-swatch-custom').toggleClass('sd-has-color', custom && !!hex).css({ 'background-color': custom && hex ? value : '', color: custom && hex ? contrastColor(hex) : '' });
        const kind = $wrap.attr('data-kind');
        const fallback = kind === 'dashboard' ? dashboardPrimary() : '';
        $wrap.find('.sd-swatch-default .sd-dot').css('background', kind === 'dashboard' ? fallback : kind === 'auto' ? 'linear-gradient(135deg, #ffffff 50%, #0f172a 50%)' : kind === 'badge' ? DASHBOARD_ERROR : '#ffffff');
        $wrap.find('.sd-color-picker').val(hex || hexForPicker(fallback) || '#808080');
    }
    function updateReset($input) {
        const def = $input.attr('data-default');
        const $btn = $input.siblings('.sd-reset');
        if (def === undefined || !$btn.length) return;
        $btn.css('visibility', $input.val() !== '' && Number($input.val()) === Number(def) ? 'hidden' : 'visible');
    }
    function attachResets() {
        $('#sd-editor input[type=number][data-default]').each(function () {
            const $input = $(this);
            if (!$input.siblings('.sd-reset').length) {
                $('<button type="button" class="red-ui-button sd-reset"><i class="fa fa-undo"></i></button>').insertAfter($input);
            }
            $input.siblings('.sd-reset').attr({ title: t('reset.title', { value: $input.attr('data-default') }), 'aria-label': t('reset.title', { value: $input.attr('data-default') }) });
            updateReset($input);
        });
    }

    // ---- icon picker ---------------------------------------------------------------------------------------
    // A button showing the current icon; it opens a panel below with PrimeIcons, Material Design Icons and own images.
    // options.noneLabel names the empty choice (e.g. "keep the icon" for the close icon).
    function iconPicker($slot, $panelSlot, $input, options) {
        const noneLabel = (options && options.noneLabel) || t('icon.none');
        const $button = $('<button type="button" class="red-ui-button sd-icon-button" aria-haspopup="dialog"><span class="sd-icon"></span><span class="sd-icon-name"></span><i class="fa fa-caret-down"></i></button>').appendTo($slot);
        const $panel = $('<div class="sd-icon-panel" hidden>' +
            '<div class="button-group sd-icon-sets">' +
                '<button type="button" class="red-ui-button toggle" data-set="pi"></button>' +
                '<button type="button" class="red-ui-button toggle" data-set="mdi"></button>' +
                '<button type="button" class="red-ui-button toggle" data-set="image"></button>' +
            '</div>' +
            '<div class="sd-icon-browse"><input type="text" class="sd-icon-search"><div class="sd-icon-grid" role="listbox"></div><div class="sd-icon-count"></div></div>' +
            '<div class="sd-icon-image" hidden>' +
                '<p class="sd-hint sd-icon-image-intro"></p>' +
                '<div class="sd-icon-image-row"><button type="button" class="red-ui-button sd-icon-upload"><i class="fa fa-upload"></i> <span></span></button><input type="file" class="sd-icon-file" accept=".svg,.png,.webp,.gif,.jpg,.jpeg" hidden></div>' +
                '<div class="sd-icon-image-row"><input type="text" class="sd-icon-url"><button type="button" class="red-ui-button sd-icon-url-apply"></button></div>' +
                '<div class="sd-icon-image-error"></div>' +
                '<p class="sd-hint sd-icon-image-tips"></p>' +
            '</div>' +
        '</div>').appendTo($panelSlot);
        const maxBytes = Math.floor(schema.limits.iconImageChars * 3 / 4);
        $panel.find('[data-set="pi"]').text('PrimeIcons');
        $panel.find('[data-set="mdi"]').text('Material Design');
        $panel.find('[data-set="image"]').text(t('icon.imageTab'));
        $panel.find('.sd-icon-image-intro').text(t('icon.imageIntro'));
        $panel.find('.sd-icon-upload span').text(t('icon.upload'));
        $panel.find('.sd-icon-url').attr({ placeholder: t('icon.urlPlaceholder'), 'aria-label': t('icon.url') });
        $panel.find('.sd-icon-url-apply').text(t('icon.apply'));
        $panel.find('.sd-icon-image-tips').text(t('icon.imageTips', { kb: Math.floor(maxBytes / 1024) }));
        const $search = $panel.find('.sd-icon-search').attr({ placeholder: t('icon.search'), 'aria-label': t('icon.search') });
        const $grid = $panel.find('.sd-icon-grid');
        const $error = $panel.find('.sd-icon-image-error');
        let set = 'pi';
        $input.data('target', $button);
        function refresh() {
            const value = $input.val();
            renderIcon($button.find('.sd-icon'), value);
            $button.find('.sd-icon-name').text(value ? iconName(value) : noneLabel);
            $button.attr('aria-expanded', String(!$panel.prop('hidden')));
        }
        function showSet(name) {
            set = name;
            $panel.find('.sd-icon-sets button').each(function () { $(this).toggleClass('selected', $(this).attr('data-set') === set); });
            $panel.find('.sd-icon-browse').prop('hidden', set === 'image');
            $panel.find('.sd-icon-image').prop('hidden', set !== 'image');
            $error.text('');
            if (set === 'image') {
                const value = $input.val();
                $panel.find('.sd-icon-url').val(/^(https?:|\/)/.test(value) ? value : '');
            } else {
                if (set === 'mdi') loadMdiIcons();
                fill();
            }
        }
        function fill() {
            const prefix = set + '-';
            const query = $search.val().trim().toLowerCase().replace(/\s+/g, '-').replace(/^(pi|mdi)-/, '');
            const current = $input.val();
            const map = set === 'pi' ? icons : mdiIcons;
            $grid.empty();
            $panel.find('.sd-icon-count').text('');
            if (map === 'loading') { $('<div class="sd-icon-empty"></div>').text(t('icon.loading')).appendTo($grid); return; }
            if (!map || typeof map !== 'object') { $('<div class="sd-icon-empty"></div>').text(t('icon.unavailable')).appendTo($grid); return; }
            if (!query) $('<button type="button" class="sd-icon-option sd-icon-none" data-icon="">&empty;</button>').attr({ title: noneLabel, 'aria-label': noneLabel }).toggleClass('active', current === '').appendTo($grid);
            const names = Object.keys(map).filter(function (name) { return !query || name.slice(prefix.length).indexOf(query) !== -1; });
            // Large sets are capped; the search narrows them down.
            names.slice(0, ICON_GRID_LIMIT).forEach(function (name) {
                const short = name.slice(prefix.length);
                $('<button type="button" class="sd-icon-option" role="option"></button>').attr({ 'data-icon': name, title: short, 'aria-label': short })
                    .toggleClass('active', name === current).append(renderIcon($('<span class="sd-icon"></span>'), name)).appendTo($grid);
            });
            if (!names.length) $('<div class="sd-icon-empty"></div>').text(t('icon.noMatch')).appendTo($grid);
            if (names.length > ICON_GRID_LIMIT) $panel.find('.sd-icon-count').text(t('icon.more', { shown: ICON_GRID_LIMIT, total: names.length }));
        }
        function close() { $panel.prop('hidden', true); refresh(); }
        function choose(value) {
            $input.val(value).trigger('change');
            close();
            $button.trigger('focus');
        }
        $button.on('click', function () {
            const opening = $panel.prop('hidden');
            $('#sd-editor .sd-icon-panel').prop('hidden', true);
            $panel.prop('hidden', !opening);
            if (opening) {
                const value = $input.val();
                $search.val('');
                showSet(value.startsWith('mdi-') ? 'mdi' : value && !value.startsWith('pi-') ? 'image' : 'pi');
                if (set !== 'image') $search.trigger('focus');
            }
            refresh();
        });
        $panel.on('click', '.sd-icon-sets button', function () {
            showSet($(this).attr('data-set'));
            if (set !== 'image') $search.trigger('focus');
        });
        $panel.on('keydown', function (event) {
            if (event.key === 'Escape') { event.preventDefault(); event.stopPropagation(); close(); $button.trigger('focus'); }
        });
        $search.on('input', fill).on('keydown', function (event) {
            if (event.key === 'Enter') { event.preventDefault(); $grid.find('.sd-icon-option').first().trigger('click'); }
        });
        $panel.on('click', '.sd-icon-option', function () { choose($(this).attr('data-icon')); });
        $panel.on('click', '.sd-icon-upload', function () { $panel.find('.sd-icon-file').val('').trigger('click'); });
        $panel.on('change', '.sd-icon-file', function () {
            const file = this.files && this.files[0];
            if (!file) return;
            const tooLarge = t('icon.errSize', { kb: Math.floor(maxBytes / 1024), size: Math.ceil(file.size / 1024) });
            if (!/^image\/(svg\+xml|png|gif|webp|jpeg)$/.test(file.type)) { $error.text(t('icon.errType')); return; }
            if (file.size > maxBytes) { $error.text(tooLarge); return; }
            const reader = new window.FileReader();
            reader.onload = function () {
                if (isIconValue(reader.result)) choose(reader.result);
                else $error.text(tooLarge);
            };
            reader.onerror = function () { $error.text(t('icon.errRead')); };
            reader.readAsDataURL(file);
        });
        $panel.on('click', '.sd-icon-url-apply', function () {
            const url = $panel.find('.sd-icon-url').val().trim();
            if (ICON_URL.test(url)) choose(url);
            else $error.text(t('icon.errUrl'));
        });
        $panel.on('keydown', '.sd-icon-url', function (event) {
            if (event.key === 'Enter') { event.preventDefault(); $panel.find('.sd-icon-url-apply').trigger('click'); }
        });
        $input.on('change', refresh);
        // Called when the Material Design list arrives after the picker was built.
        $input.data('refreshIcon', function () { refresh(); if (!$panel.prop('hidden') && set === 'mdi') fill(); });
        refresh();
    }

    // ---- actions -------------------------------------------------------------------------------------------
    function buildActionList(actions) {
        const $list = $('#node-input-actions-list');
        $list.editableList({
            addButton: t('actions.add'),
            removable: true,
            sortable: true,
            height: 'auto',
            addItem: function (container, index, data) { buildActionRow(container, index, data); },
            removeItem: listChanged,
            sort: listChanged
        });
        actions.forEach(function (action) { $list.editableList('addItem', action); });
        // Long lists start collapsed to one line per action.
        if (actions.length > 3) $list.find('.sd-action').each(function () { setCollapsed($(this), true); });
        updateEmpty();
    }
    function listChanged() { window.setTimeout(function () { updateEmpty(); validateEditor(); }, 0); }
    function updateEmpty() { $('#sd-actions-empty').toggle(!$('#node-input-actions-list').editableList('length')); }
    function fieldHtml(id, key, extra) {
        return '<div class="sd-field"><label for="' + id + '">' + esc(t('field.' + key)) + '</label><input type="text" id="' + id + '" data-action-key="' + key + '"' + (extra || '') + '></div>';
    }
    function buildActionRow(container, index, data) {
        const item = $.extend(true, {}, data || {});
        const isNew = !item.id;
        // Earlier versions saved the label placeholder uninterpolated ("Aktion {{n}}"); it was never meant as text.
        if (!isNew && typeof item.label === 'string' && item.label.indexOf('{{n}}') !== -1) item.label = item.label.replace('{{n}}', String(index + 1));
        const $row = $('<div class="sd-action"></div>').appendTo(container);
        // New actions derive their ID (and a text payload) from the label until the user edits them.
        $row.data('auto', { id: isNew, payload: isNew });
        if (isNew) {
            item.label = t('actions.newLabel', { n: index + 1 });
            item.icon = schema.action.icon.default;
            item.id = uniqueId(slug(item.label), $row);
            item.payloadType = 'str';
            item.payload = item.id;
        }
        const p = 'sd-a' + (++rowSeq) + '-';
        $row.html(
            '<div class="sd-action-head">' +
                '<button type="button" class="sd-toggle" aria-expanded="true"><i class="fa fa-angle-down"></i></button>' +
                '<span class="sd-icon sd-action-glyph" aria-hidden="true"></span>' +
                '<span class="sd-action-title"><span class="sd-action-label"></span> <span class="sd-action-id"></span></span>' +
                '<button type="button" class="red-ui-button red-ui-button-small sd-copy"><i class="fa fa-clone"></i></button>' +
            '</div>' +
            '<div class="sd-action-error" aria-live="polite"></div>' +
            '<div class="sd-action-body">' +
                '<div class="sd-action-main">' +
                    '<div class="sd-field"><label>' + esc(t('field.icon')) + '</label><div class="sd-icon-slot"></div><input type="hidden" data-action-key="icon"></div>' +
                    fieldHtml(p + 'label', 'label', ' maxlength="' + schema.action.label.max + '"') +
                '</div>' +
                '<div class="sd-icon-panel-slot"></div>' +
                '<div class="sd-field"><label for="' + p + 'payload">' + esc(t('field.payload')) + '</label><input type="text" id="' + p + 'payload" data-action-key="payload"><div class="sd-hint">' + esc(t('hint.payload')) + '</div></div>' +
                '<details class="sd-more"><summary>' + esc(t('actions.more')) + '</summary><div class="sd-action-grid">' +
                    '<div class="sd-field sd-wide"><label for="' + p + 'id">' + esc(t('field.id')) + '</label><input type="text" id="' + p + 'id" data-action-key="id" maxlength="64"><div class="sd-hint">' + esc(t('hint.id')) + '</div></div>' +
                    fieldHtml(p + 'topic', 'topic', ' maxlength="' + schema.action.topic.max + '"') +
                    fieldHtml(p + 'tooltip', 'tooltip', ' maxlength="' + schema.action.tooltip.max + '"') +
                    '<div class="sd-field sd-wide"><label for="' + p + 'background">' + esc(t('field.actionBackground')) + '</label>' + colorControl('id="' + p + 'background" data-action-key="background"', 'default') + '</div>' +
                    '<div class="sd-field sd-wide"><label for="' + p + 'color">' + esc(t('field.iconColor')) + '</label>' + colorControl('id="' + p + 'color" data-action-key="color"', 'auto') + '</div>' +
                    '<label class="sd-check"><input type="checkbox" data-action-key="visible"> ' + esc(t('field.visible')) + '</label>' +
                    '<label class="sd-check"><input type="checkbox" data-action-key="enabled"> ' + esc(t('field.enabled')) + '</label>' +
                '</div></details>' +
            '</div>');
        $row.find('.sd-color-text').each(function () { enhanceColor($(this)); });
        $row.find('[data-action-key]').each(function () {
            const $input = $(this);
            const key = $input.attr('data-action-key');
            const field = schema.action[key];
            if (key === 'payload') return;
            const value = has(item, key) ? item[key] : defaultFor(field);
            if ($input.attr('type') === 'checkbox') $input.prop('checked', value === true);
            else $input.val(value == null ? '' : String(value));
            if ($input.hasClass('sd-color-text')) syncColor($input);
        });
        const payloadType = PAYLOAD_TYPES.includes(item.payloadType) ? item.payloadType
            : typeof item.payload === 'string' ? 'str' : typeof item.payload === 'number' ? 'num' : typeof item.payload === 'boolean' ? 'bool' : 'json';
        let payloadText = item.payload;
        if (payloadType === 'json' && typeof payloadText !== 'string') payloadText = JSON.stringify(payloadText === undefined ? null : payloadText);
        else if (payloadText === undefined || payloadText === null) payloadText = payloadType === 'json' ? 'null' : '';
        const $payload = $row.find('[data-action-key="payload"]');
        $payload.typedInput({ default: payloadType, types: PAYLOAD_TYPES });
        $payload.typedInput('type', payloadType);
        $payload.typedInput('value', String(payloadText));
        iconPicker($row.find('.sd-icon-slot'), $row.find('.sd-icon-panel-slot'), $row.find('[data-action-key="icon"]'));

        $row.on('click', '.sd-toggle, .sd-action-title', function () { setCollapsed($row, $row.find('.sd-action-body').is(':visible')); });
        $row.on('click', '.sd-copy', function () { duplicateAction($row); });
        $row.on('input', '[data-action-key="label"]', function () {
            const auto = $row.data('auto');
            if (!auto.id) return;
            const id = uniqueId(slug($(this).val()), $row);
            $row.find('[data-action-key="id"]').val(id);
            if (auto.payload) setPayloadText($row, id);
        });
        $row.on('input', '[data-action-key="id"]', function () {
            const auto = $row.data('auto');
            auto.id = false;
            if (auto.payload) setPayloadText($row, $(this).val());
        });
        $payload.on('input change', function () { if (!$row.data('settingPayload')) $row.data('auto').payload = false; });
        $row.on('input change', 'input:not(.sd-icon-search),select', function () { updateActionTitle($row); validateEditor(); });
        updateActionTitle($row);
        updateEmpty();
        window.setTimeout(validateEditor, 0);
    }
    function setPayloadText($row, text) {
        const $payload = $row.find('[data-action-key="payload"]');
        if ($payload.typedInput('type') !== 'str') return;
        $row.data('settingPayload', true);
        $payload.typedInput('value', text);
        $row.data('settingPayload', false);
    }
    function updateActionTitle($row) {
        const label = $row.find('[data-action-key="label"]').val() || '';
        const flags = ($row.find('[data-action-key="visible"]').prop('checked') === false ? t('actions.hidden') : '') +
            ($row.find('[data-action-key="enabled"]').prop('checked') === false ? t('actions.disabled') : '');
        $row.find('.sd-action-label').text(label || t('actions.noLabel'));
        $row.find('.sd-action-id').text($row.find('[data-action-key="id"]').val() + flags);

    function previewConfig() {

        const clampNumber = function (section, key) {

            const value = cfg[section][key];

        };
        ['size', 'radius', 'offsetX', 'offsetY'].forEach(function (key) { clampNumber('button', key); });
        ['gap', 'duration', 'actionSize', 'radius'].forEach(function (key) { clampNumber('menu', key); });
        clampNumber('theme', 'radius');

        const color = function (value) { return hexForPicker(value) ? value : ''; };
        ['background', 'color'].forEach(function (key) { cfg.button[key] = color(cfg.button[key]); cfg.theme[key] = color(cfg.theme[key]); });
        cfg.button.icon = isIconValue(cfg.button.icon) ? cfg.button.icon : '';
        cfg.button.closeIcon = isIconValue(cfg.button.closeIcon) ? cfg.button.closeIcon : '';

    // ---- validation ----------------------------------------------------------------------------------------
    function checkField(value, field) {
        switch (field.type) {
        case 'string':
            return typeof value === 'string' && (field.max === undefined || value.length <= field.max) ? '' : t('err.maxChars', { max: field.max });
        case 'number':
            if (value === undefined) return t('err.required');
            if (!Number.isFinite(value)) return t('err.number');
            if ((field.min !== undefined && value < field.min) || (field.max !== undefined && value > field.max)) return t('err.range', { min: field.min, max: field.max });
            return '';
        case 'boolean': return typeof value === 'boolean' ? '' : t('err.invalid');
        case 'badge':
            if (typeof value === 'number') return Number.isFinite(value) ? '' : t('err.number');
            return typeof value === 'string' && value.length <= field.max ? '' : t('err.maxChars', { max: field.max });
        case 'enum': return field.values.includes(value) ? '' : t('err.invalid');
        case 'icon':
            return isIconValue(value) ? '' : t('err.icon');
        case 'color': return value === '' || /^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/.test(value) ? '' : t('err.color');
        case 'id':
            if (value === '') return t('err.required');
            return /^[A-Za-z0-9][A-Za-z0-9_.:-]{0,63}$/.test(value) ? '' : t('err.idFormat');
        default: return '';
        }
    }
    function checkJsonValue(value, depth) {
        if (depth > schema.limits.jsonDepth) throw new Error(t('err.depth'));
        if (typeof value === 'number' && !Number.isFinite(value)) throw new Error(t('err.payloadNumber'));
        if (Array.isArray(value)) value.forEach(function (v) { checkJsonValue(v, depth + 1); });
        else if (value && typeof value === 'object') Object.keys(value).forEach(function (k) { checkJsonValue(value[k], depth + 1); });
    }
    function parsePayload(type, text) {
        if (type === 'str') return text;
        if (type === 'bool') {
            if (text !== 'true' && text !== 'false') throw new Error(t('err.bool'));
            return text === 'true';
        }
        let value;
        try { value = JSON.parse(text); } catch (error) { throw new Error(t(type === 'num' ? 'err.payloadNumber' : 'err.json')); }
        if (type === 'num' && (typeof value !== 'number' || !Number.isFinite(value))) throw new Error(t('err.payloadNumber'));
        checkJsonValue(value, 0);
        if (bytes(JSON.stringify(value)) > schema.limits.jsonBytes) throw new Error(t('err.tooLarge'));
        return value;
    }
    // Reads the dialog; every problem goes to report($field, message[, $actionRow, fieldKey]).
    function collect(report) {
        const config = { button: {}, menu: {}, theme: {} };
        for (const section of SECTIONS) {
            for (const [key, field] of Object.entries(schema[section])) {
                const $input = control(section, key);
                if (!$input.length) continue;
                const value = readControl($input, field);
                const problem = checkField(value, field);
                if (problem) report($input, problem);
                config[section][key] = value;
            }
        }
        const allowed = schema.geometry.directions[config.menu.shape] || [];
        if (config.menu.direction !== 'auto' && allowed.length && !allowed.includes(config.menu.direction)) report(control('menu', 'direction'), t('err.invalid'));
        config.actions = [];
        const ids = new Set();
        $('#node-input-actions-list').editableList('items').each(function () {
            const $row = $(this).find('.sd-action');
            const action = readRow($row);
            for (const [key, field] of Object.entries(schema.action)) {
                if (key === 'payload' || (key === 'topic' && action.topic === '')) continue;
                const problem = checkField(action[key], field);
                if (problem) report($row.find('[data-action-key="' + key + '"]'), problem, $row, key);
            }
            if (action.id && ids.has(action.id)) report($row.find('[data-action-key="id"]'), t('err.dupId'), $row, 'id');
            ids.add(action.id);
            try { parsePayload(action.payloadType, action.payload); } catch (error) { report($row.find('[data-action-key="payload"]'), error.message, $row, 'payload'); }
            if (action.topic === '') delete action.topic;
            config.actions.push(action);
        });
        if (config.actions.length > schema.limits.actions) report($('#node-input-actions-list'), t('err.maxActions', { max: schema.limits.actions }));
        return config;
    }
    function targetOf($input) {
        const $target = $input.data('target');
        if ($target && $target.length) return $target;
        const $typed = $input.closest('.red-ui-typedInput-container');
        if ($typed.length) return $typed;
        const $node = $input.siblings('.red-ui-typedInput-container, .red-ui-editableList-container');
        return $node.length ? $node : $input;
    }
    function validateEditor() {
        const $ok = $('#node-dialog-ok');
        if (!schema) { $ok.prop('disabled', true); return false; }
        $('#sd-editor .sd-field-error').remove();
        $('#sd-editor .input-error').removeClass('input-error');
        $('#sd-editor .sd-has-error').removeClass('sd-has-error');
        $('#sd-actions-error').hide().text('');
        $('#node-input-actions-list .sd-action-error').empty();
        const panes = new Set();
        let count = 0;
        function report($input, message, $row, key) {
            count += 1;
            const $target = targetOf($input).addClass('input-error');
            const pane = $target.closest('.sd-tab-pane').attr('data-pane');
            if (pane) panes.add(pane);
            if ($row) {
                $row.addClass('sd-has-error');
                $('<div></div>').text(t('field.' + key) + ': ' + message).appendTo($row.find('.sd-action-error'));
                const $details = $target.closest('details');
                if ($details.length) $details.addClass('sd-has-error').prop('open', true);
            } else if ($input.is('#node-input-actions-list')) {
                $('#sd-actions-error').text(message).show();
            } else {
                $('<div class="sd-field-error"></div>').text(message).insertAfter(rowOf($target));
            }
        }
        const scope = syncScope();
        const ref = { group: '#node-input-group', page: '#node-input-page', pages: '#node-input-ui', all: '#node-input-ui' }[scope];
        if (!ref) report($('#node-input-placement'), t('err.invalid'));
        else if (!$(ref).val() || $(ref).val() === '_ADD_') report($(ref), t('err.selectRef', { what: t('ref.' + scope) }));
        else if (scope === 'pages' && !selectedPages().length) report($('#sd-page-list'), t('err.selectPages'));
        const config = collect(report);
        if (!count) {
            const runtime = config.actions.map(function (action) {
                const converted = Object.assign({}, action, { payload: parsePayload(action.payloadType, action.payload) });
                delete converted.payloadType;
                return converted;
            });
            if (bytes(JSON.stringify({ actions: runtime, button: config.button, menu: config.menu, theme: config.theme })) > schema.limits.jsonBytes) {
                report($('#node-input-actions-list'), t('err.configSize'));
            }
        }
        $('#sd-tab-bar button').each(function () { $(this).toggleClass('sd-has-error', panes.has($(this).attr('data-pane'))); });
        if (count) {
            const names = Array.from(panes).map(function (pane) { return t('tab.' + pane); });
            showBanner(names.length ? t('err.summaryTabs', { tabs: names.join(', ') }) : t('err.summary'), true);
        } else $('#sd-banner').hide();
        $ok.prop('disabled', count > 0);
        renderPreview(false);
        return count === 0;
    }
    function saveEditor(node) {
        if (!schema || !validateEditor()) return;
        const config = collect(function () {});
        node.actions = config.actions;
        for (const section of SECTIONS) node[section] = Object.assign({}, dropPreserved ? {} : preserved[section], config[section]);
        node.scope = syncScope();
        node.placement = placementValue();
        node.headerSlot = headerSlotValue();
        node.pages = node.scope === 'pages' ? selectedPages() : [];
        // Let Node-RED save config-node references and maintain their users lists.
        if (node.scope !== 'group') $('#node-input-group').val('');
        if (node.scope !== 'page') $('#node-input-page').val('');
        if (node.scope !== 'all' && node.scope !== 'pages') $('#node-input-ui').val('');
        node.width = Number($('#node-input-width').val()) || 0;
        node.height = Number($('#node-input-height').val()) || 0;
    }

    // ---- events --------------------------------------------------------------------------------------------
    function bindEvents() {
        const $editor = $('#sd-editor').off('.speedDial');
        $editor.on('input.speedDial change.speedDial', '[data-section]', function () {
            const $el = $(this);
            if ($el.hasClass('sd-color-text')) syncColor($el);
            if ($el.attr('type') === 'number') updateReset($el);
            updateDependent();
            validateEditor();
        });
        $editor.on('change.speedDial', '#node-input-placement, #sd-page-mode, #node-input-group, #node-input-page, #node-input-ui', function () {
            if (this.id === 'node-input-ui') buildPageList();
            updateDependent();
            validateEditor();
        });
        $editor.on('change.speedDial', '#sd-page-list input[data-page]', function () {
            if (this.checked) pageSelection.add($(this).attr('data-page'));
            else pageSelection.delete($(this).attr('data-page'));
            validateEditor();
        });
        $editor.on('click.speedDial', '#sd-header-slot-buttons button', function () {
            $('#node-input-headerSlot').val($(this).attr('data-slot'));
            updateDependent();
            validateEditor();
            showMenuInPreview();
        });
        // Header tip: a small transparent button fits the app bar like its other icons.
        $editor.on('click.speedDial', '#sd-header-apply', function () {
            control('button', 'size').val(SIZE_PRESETS.s);
            control('button', 'background').val(COLOR_TRANSPARENT).trigger('input');
        });
        $editor.on('click.speedDial', '.sd-swatch[data-color]', function () {
            $(this).closest('.sd-color').find('.sd-color-text').val($(this).attr('data-color')).trigger('input');
        });
        // The browser's colour dialog reports while dragging, so the preview follows live.
        $editor.on('input.speedDial', '.sd-color-picker', function () {
            $(this).closest('.sd-color').find('.sd-color-text').val(this.value).trigger('input');
        });
        $editor.on('input.speedDial change.speedDial', '.sd-color-text', function () { syncColor($(this)); });
        $editor.on('click.speedDial', '.sd-reset', function () {
            const $input = $(this).siblings('input[type=number]').first();
            $input.val($input.attr('data-default')).trigger('input').trigger('focus');
        });
        $editor.on('click.speedDial', '#sd-position-grid .sd-pos', function () { control('button', 'position').val($(this).attr('data-value')).trigger('change'); showMenuInPreview(); });
        $editor.on('click.speedDial', '#sd-style-cards .sd-style', function () { applyStyle($(this).attr('data-value')); showMenuInPreview(); });
        $editor.on('click.speedDial', '#sd-direction-buttons .sd-direction', function () { control('menu', 'direction').val($(this).attr('data-value')).trigger('change'); showMenuInPreview(); });
        $editor.on('click.speedDial', '.sd-size-preset', function () { control('button', 'size').val(SIZE_PRESETS[$(this).attr('data-size')]).trigger('input'); });
        $editor.on('input.speedDial', '#sd-offset', function () {
            updateReset($(this));
            control('button', 'offsetX').val(this.value);
            control('button', 'offsetY').val(this.value).trigger('input');
        });
        $editor.on('change.speedDial', '#sd-offset-separate', function () {
            if (!this.checked) {
                const value = control('button', 'offsetX').val();
                $('#sd-offset').val(value);
                updateReset($('#sd-offset'));
                control('button', 'offsetY').val(value);
            }
            updateDependent();
            validateEditor();
        });
        $editor.on('click.speedDial', '#sd-preserved-drop', function () { dropPreserved = true; showPreserved(); });
        $editor.on('click.speedDial', '#sd-tab-bar button', function () {
            const pane = $(this).attr('data-pane');
            $('#sd-tab-bar button').removeClass('active').attr('aria-selected', 'false');
            $(this).addClass('active').attr('aria-selected', 'true');
            $('#sd-editor .sd-tab-pane').attr('hidden', true);
            $('#sd-pane-' + pane).removeAttr('hidden');
            $('#sd-editor .sd-icon-panel').prop('hidden', true);
            if (pane === 'look') renderPreview(false);
        });
        bindPreviewEvents($editor);
        // "toggle" does not bubble, so it is bound on the element itself.
        $('#sd-preview-details').off('.speedDial').on('toggle.speedDial', function () {
            previewOpen = false;
            previewMessage = '';
            if (this.open) renderPreview(false);
        });
        $editor.on('click.speedDial', '#sd-collapse-all', function () { $('#node-input-actions-list .sd-action').each(function () { setCollapsed($(this), true); }); });
        $editor.on('click.speedDial', '#sd-expand-all', function () { $('#node-input-actions-list .sd-action').each(function () { setCollapsed($(this), false); }); });
    }
}());
</script>
